description: >-
  What a step on another host than its job's wrote to $OUTPUTS there, in a
  try that failed, is its job's, as what a try where its job runs wrote is,
  and its ignore-errors: lets the step succeed: a later step, whose if: is
  the word always, reads it.
source: ACTIVATE's executor, and Meridian
hosts:
  farm: {}
expect:
  run:
    outcome: success
    jobs:
      main:
        outcome: success
        logs:
          - {step: 1, text: "[written]\n"}
