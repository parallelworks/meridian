description: >-
  A step's cleanup: runs once the job's steps have run, as a step of its own,
  as format 1 runs a copy of the step: it reads every step's outputs, as
  they are at the end of the job, and reads an output that no step wrote as
  "", even once a step has failed. A step that didn't run doesn't clean up,
  and the step's if: is evaluated again, with the job's status as it ends,
  so a step whose if: is success() isn't cleaned up once another failed.
source: ACTIVATE's script submitter tutorial and executor, and Meridian
jobs:
  pbs_job:
    steps:
      - {outcome: success, outputs: {jobid: "4242.pbs"}}
      - {outcome: success}
      - {outcome: failure}
      - {outcome: skipped}
expect:
  skipped:
    - /jobs/pbs_job/steps/1/cleanup
    - /jobs/pbs_job/steps/3
    - /jobs/pbs_job/steps/3/cleanup
  values:
    /jobs/pbs_job/steps/0/cleanup: qdel "4242.pbs"
    /jobs/pbs_job/steps/2/cleanup: echo "state=[] failed=true"
