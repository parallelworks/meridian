description: >-
  Operators work as JavaScript's do: && and || return one of their operands,
  == converts before comparing and === doesn't, + joins when either side is a
  string, and the other arithmetic converts both sides to numbers.
source: ACTIVATE's documentation and tests
scope:
  contexts:
    inputs:
      num: 5
      flag: true
      off: false
      name: Alice
      empty: ""
cases:
  # The examples in ACTIVATE's documentation.
  - expr: "true && 'truthy value'"
    value: truthy value
  - expr: 0 && true
    value: 0
  - expr: "'truthy value' && false"
    value: false
  - expr: "false || 'any value'"
    value: any value
  - expr: "'truthy value' || 'any value'"
    value: truthy value
  - expr: 1 == true
    value: true
  - expr: 1 != true
    value: false
  - expr: 1 === true
    value: false
  - expr: 1 !== true
    value: true
  - expr: "'a' > 'b'"
    value: false
  - expr: 1.5 < 1
    value: false
  - expr: 1.0 >= 1
    value: true
  - expr: false <= true
    value: true
  - expr: "'a' + 'b'"
    value: ab
  - expr: 1 + 1.5
    value: 2.5
  - expr: 1 - 1.5
    value: -0.5
  - expr: 4 * 4
    value: 16
  - expr: 9 / 4
    value: 2.25
  - expr: 2 ** 4
    value: 16
  - expr: 4 // 3
    value: 1
  - expr: "'hello' ?? 'default'"
    value: hello
  - expr: "undefined ?? 'default'"
    value: default
  - expr: "!false"
    value: true
  - expr: true && (true || true) && false
    value: false
  - expr: 10 / (2 + 8)
    value: 1
  - expr: "true && false ? 'a' : 'b'"
    value: b
  - expr: "'truthy value' ? 'a' : 'b'"
    value: a

  # Precedence: ?: binds loosest, then ||, &&, comparisons, +, *, and **.
  - expr: true && true || false && false
    value: true
  - expr: 1 + 2 * 2 ^ 3 * 2
    value: 33
  - expr: 500 - 400 > 499 / 5 && 500 - 400 >= 500 / 5
    value: true
  - expr: 500 - 400 > 500 / 5 || 500 - 400 >= 501 / 5
    value: false
  - expr: "!(true || false)"
    value: false
  - expr: "!true && '0' || 2"
    value: 2
  - expr: "true && '0' || 2"
    value: "0"
  - expr: true && 0 || 2
    value: 2
  - expr: (2 + 3) * 4
    value: 20
  - expr: 2 + 3 * 4
    value: 14
  # The power operators group from the right, as JavaScript's ** does: this
  # is 2 ** (3 ** 2). Format 1 grouped them from the left before, giving 64.
  - expr: 2 ** 3 ** 2
    value: 512
  - expr: 2 ^ 3 ^ 2
    value: 512
  - expr: 2 exp 3 exp 2
    value: 512
  - expr: 2 ** 3 ^ 2 exp 1
    value: 512
  # - before a number, and a prefix operator, still bind tighter.
  - expr: -2 ** 2
    value: 4
  - expr: 2 ** -1
    value: 0.5
  - expr: 4 ** 0.5 * 3
    value: 6

  # and and or are && and ||, in any case.
  - expr: false or inputs.name
    value: Alice
  - expr: true AND inputs.num
    value: 5
  - expr: false OR inputs.name
    value: Alice

  # Comparisons convert, except === and !==.
  - expr: "'5' == 5"
    value: true
  - expr: "'5' === 5"
    value: false
  - expr: "'' == 0"
    value: true
  - expr: null == 0
    value: false
  - expr: null == undefined
    value: true
  - expr: "'abc' == 0"
    value: false
  - expr: "'true' == true"
    value: false
  - expr: "'1' == true"
    value: true
  - expr: "'b' < 'a'"
    value: false
  - expr: "'10' < '9'"
    value: true
  - expr: "'10' < 9"
    value: false
  - expr: "'abc' < 1"
    value: false
  - expr: "'abc' >= 1"
    value: false
  - expr: inputs.num>3
    value: true
  - expr: "'pbs' !=inputs.name"
    value: true
  - expr: inputs.num == 5&&inputs.flag
    value: true

  # Arithmetic converts to numbers; + joins if either side is a string.
  - expr: "'44.1' - '24'"
    value: 20.1
  - expr: "'44.1' + 24"
    value: "44.124"
  - expr: 1 + true
    value: 2
  # null is empty wherever a string is made of it, as in a template's text.
  # Format 1 gave "anull" before.
  - expr: "'a' + null"
    value: a
  - expr: "null + 'b'"
    value: b
  - expr: "'a' + inputs.missing"
    value: a
  # Two nulls are numbers.
  - expr: null + null
    value: 0
  - expr: "'n=' + 1.0"
    value: n=1
  - expr: inputs.num*2+1
    value: 11
  - expr: -100 - -1010
    value: 910
  - expr: -2 * 4
    value: -8
  - expr: -inputs.num
    value: -5
  - expr: 3 / 2
    value: 1.5
  - expr: 3 // 2
    value: 1
  - expr: 3.5 // 1
    value: 3
  - expr: 7 % 3
    value: 1
  - expr: 7 mod 3
    value: 1
  - expr: -7 % 3
    value: -1
  - expr: 2 exp 10
    value: 1024
  - expr: 10 / 0
    value: .inf
  - expr: 0 - 10 / 0
    value: -.inf
  - expr: 0 / 0
    value: .nan
  - expr: "'abc' * 2"
    value: .nan
  - expr: 1e19
    value: 1e19
  - expr: inputs.missing - 1
    value: -1
  # Unlike JavaScript, where [1] + [2] is "12", + adds lists as numbers.
  - expr: "[1] + [2]"
    value: .nan

  # A string is read as a number as JavaScript's Number() reads it. Format 1
  # read it as Go does before, where 1_000 and 0x1p4 were numbers and 0xff
  # wasn't.
  - expr: "'1_000' - 0"
    value: .nan
  - expr: "'0x1p4' - 0"
    value: .nan
  - expr: "'0xff' - 0"
    value: 255
  - expr: "'0o17' - 0"
    value: 15
  - expr: "'0b101' - 0"
    value: 5
  # A sign before 0x, 0o or 0b makes a string not a number.
  - expr: "'-0x10' - 0"
    value: .nan
  - expr: "'0x' - 0"
    value: .nan
  - expr: "'017' - 0"
    value: 17
  - expr: "'.5' - 0"
    value: 0.5
  - expr: "'5.' - 0"
    value: 5
  - expr: "'-2.5E-3' - 0"
    value: -0.0025
  - expr: "'+1e3' - 0"
    value: 1000
  - expr: "'1e400' - 0"
    value: .inf
  - expr: "'-1e400' - 0"
    value: -.inf
  - expr: "'Infinity' - 0"
    value: .inf
  - expr: "'-Infinity' - 0"
    value: -.inf
  - expr: "'infinity' - 0"
    value: .nan
  - expr: "'inf' - 0"
    value: .nan
  - expr: "'NaN' - 0"
    value: .nan
  - expr: "'' - 0"
    value: 0
  # JavaScript's space around a number, such as tabs, line breaks and no-break
  # spaces, is ignored, and a string of nothing else is 0.
  - expr: "' \t12\n ' - 0"
    value: 12
  - expr: "' 5 ' - 0"
    value: 5
  - expr: "'　' - 0"
    value: 0
  - expr: "'1 2' - 0"
    value: .nan

  # ! negates truthiness; any number of them.
  - expr: "!!inputs.name"
    value: true
  - expr: "!!!!true"
    value: true
  - expr: "!!!!!false"
    value: true
  - expr: "!!0"
    value: false
  - expr: "!inputs.empty"
    value: true
  - expr: "!(inputs.num > 3)"
    value: false
  # ACTIVATE gives null when the input isn't there, as if there were no !.
  - expr: "!inputs.missing.flag"
    value: true

  # ?? replaces only null.
  - expr: "inputs.missing ?? 'fallback'"
    value: fallback
  - expr: "inputs.empty ?? 'fallback'"
    value: ""
  - expr: 5 ?? default
    value: 5
  # ?? binds looser than comparisons, as in JavaScript: this is
  # 0 ?? (1 == 0). Format 1 made ?? a comparison before, so this was
  # (0 ?? 1) == 0, true.
  - expr: 0 ?? 1 == 0
    value: 0
  - expr: inputs.missing ?? 1 + 1
    value: 2
  - expr: inputs.missing ?? inputs.missing ?? 'last'
    value: last
  - expr: "inputs.missing ?? false ? 'a' : 'b'"
    value: b
  # As in JavaScript, ?? can't be mixed with || or && without parentheses.
  # Format 1 allowed it before, with ?? binding tighter than both.
  - expr: inputs.missing || false ?? true
    error: syntax
  - expr: inputs.missing ?? false || true
    error: syntax
  - expr: true && inputs.missing ?? 'x'
    error: syntax
  - expr: inputs.missing ?? true and false
    error: syntax
  - expr: inputs.missing or null ?? 'x'
    error: syntax
  - expr: (inputs.missing || null) ?? 'x'
    value: x
  - expr: inputs.missing ?? (false && true)
    value: false

  # The ternary.
  - expr: "true ? a : b"
    value: a
  - expr: "false ? a : b"
    value: b
  - expr: "true ? (false ? a : b) : (false ? c : d)"
    value: b
  - expr: "false ? false ? a : b : false ? c : d"
    value: d
  - expr: "inputs.num > 10 ? 'big' : inputs.num > 3 ? 'mid' : 'small'"
    value: mid
  # A ternary written without spaces, followed by one with them: a spaced :
  # closes the latest later ? with a space before it, so here the first
  # ternary has no spaced : of its own and is glued. The ternary groups from
  # the right, as in JavaScript. Format 1 refused this before.
  - expr: "true?1:x ? 2 : 3"
    value: 1
  - expr: "false?1:true ? 2 : 3"
    value: 2
  - expr: "inputs.off?1:x ? 2 : 3"
    value: 2
  # A spaced ternary in the first branch of a spaced one: its : closes it
  # first, and 12:30 stays a word.
  - expr: "a ? b ? 12:30 : d : e"
    value: "12:30"
  - expr: "inputs.flag ? inputs.flag ? 12:30 : 'd' : 'e'"
    value: "12:30"
  - expr: "inputs.flag ? inputs.off ? 12:30 : 13:00 : 'e'"
    value: "13:00"
  # The look-ahead skips ??, which isn't a ternary.
  - expr: "inputs.flag?inputs.missing ?? 4:5"
    value: 4
  # A glued ? doesn't count, so the outer ternary is spaced and false?1:2's
  # 1:2 is a word; parentheses make this work.
  - expr: "true ? false?1:2 : 3"
    error: syntax
  - expr: "true ? (false?1:2) : 3"
    value: 2

  # || and && don't evaluate the side they don't need.
  - expr: inputs.flag || inputs.missing.deeper
    value: true
  - expr: inputs.flag || needs.build.outputs.ok
    value: true
  - expr: inputs.empty && needs.build.outputs.ok
    value: ""
  - expr: inputs.flag && needs.build.outputs.ok
    unknown: needs
