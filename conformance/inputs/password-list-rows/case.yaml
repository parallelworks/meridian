description: >-
  A password field in a list's rows is one of the run's secrets, as a
  password input is, by its path in the values: the list's name, the row's
  index and the field's name. Its value isn't in its row, and it is checked
  as a password input's is: a number stays a number, as ACTIVATE reads
  every value as it was submitted, with a warning.
source: Meridian
inputs:
  creds:
    - user: a
      pass: HUNTER2SECRET
    - user: b
      pass: 42
    - user: c
expect:
  diagnostics:
    - severity: warning
      code: input_read_as_submitted
      path: /on/execute/inputs/creds/template/pass
      params: {input: creds.1.pass, type: password, given: number}
  inputs:
    creds:
      - user: a
      - user: b
      - user: c
  secrets:
    creds.0.pass: HUNTER2SECRET
    creds.1.pass: 42
