description: >-
  env holds the workflow's env:, then the job's over it, then the step's
  over that, as strings. A job's env: reads the workflow's, a step's env:
  reads the job's, and the rest of a step reads the step's. A job's outputs
  read the job's, and a name env doesn't have reads as "".
source: Meridian
jobs:
  main:
    steps:
      - {outcome: success}
      - {outcome: success}
expect:
  values:
    /jobs/main/steps/0/run: echo step from-workflow-and-job
    /jobs/main/steps/0/env/C: job
    /jobs/main/steps/0/env/B: from-workflow-and-job
    /jobs/main/steps/0/env/A: from-workflow
    /jobs/main/steps/1/run: echo job [] []
    /jobs/main/outputs/where: job
