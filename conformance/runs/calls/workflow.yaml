on:
  execute:
    inputs:
      greeting:
        type: string
        default: hello
env:
  FROM_CALLER: the caller
jobs:
  main:
    steps:
      - uses: github/conformance/calls@main
        with:
          $yaml: greet.yaml
          greeting: ${{ inputs.greeting }}
          token: ${{ vars.token }}
      - run: cat subworkflows/main/step_0/said
      - uses: github/conformance/calls
        with:
          $yaml: fails.yaml
      - run: echo not reached
      - if: ${{ failure() }}
        run: echo the call failed
