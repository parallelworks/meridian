description: >-
  A choice that is the text of one of an input's options' values, when that
  value is an expression, means that option, whose value is the
  expression's: a form sends that text for an option it can't evaluate
  itself. So does each choice of a multi-dropdown, and a choice from options
  in groups. Any other value holding ${{ }} is data.
source: Meridian
inputs:
  region: ${{ inputs.home }}
  regions: ["${{ inputs.home }}", us-west]
  grouped: ${{ inputs.home }}
  note: ${{ inputs.home }}
expect:
  inputs:
    home: us-east
    region: us-east
    regions: [us-east, us-west]
    grouped: us-east
    site: east
    note: ${{ inputs.home }}
