description: >-
  Reading a variable that isn't a secret but whose name looks like a
  secret's warns, once for each variable, where it is first read, and so
  does defining an input that takes text whose name looks like a secret's. A
  name looks like a secret's when one of its words, split at _, -, . and
  changes of case, is a word such as token or password, or two in a row are
  such as private key: tokenizer, secretary and max_tokens don't. A run of
  capitals before a lower-case letter ends a word before its last capital,
  so GITHUBToken is github and token. A secret variable and a password input
  don't warn.
source: Meridian
contexts:
  org:
    HF_TOKEN: unused
  vars:
    apiKey: unused
    GITHUBToken: unused
    tokenizer: unused
    DB_PASSWORD: unused
secret-variables: [DB_PASSWORD]
expect:
  diagnostics:
    - severity: warning
      code: variable_looks_secret
      path: /on/execute/inputs/hf/default
      line: 6
      column: 22
      params: {context: org, name: HF_TOKEN}
    - severity: warning
      code: variable_looks_secret
      path: /jobs/main/steps/0/run
      line: 25
      column: 43
      params: {context: vars, name: apiKey}
    - severity: warning
      code: variable_looks_secret
      path: /jobs/main/steps/1/run
      line: 26
      column: 23
      params: {context: vars, name: GITHUBToken}
    - severity: warning
      code: input_looks_secret
      path: /on/execute/inputs/api_token
      line: 7
      column: 7
    - severity: warning
      code: input_looks_secret
      path: /on/execute/inputs/hosts/template/ssh-private-key
      line: 20
      column: 11
