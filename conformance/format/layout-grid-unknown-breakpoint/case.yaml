description: >-
  A grid's breakpoints are base, sm, md and lg. Another key, such as
  phone, is ignored with a warning, as an unknown key is, which leaves
  columns without a breakpoint: an error, as columns needs one.
source: ACTIVATE's workflow schema tests
expect:
  diagnostics:
    - severity: error
      code: too_few_keys
      path: /on/execute/inputs/$meta/layout/columns
      line: 9
      column: 39
    - severity: warning
      code: unknown_key
      path: /on/execute/inputs/$meta/layout/columns/phone
      line: 9
      column: 40
