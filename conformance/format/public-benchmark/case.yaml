description: >-
  A benchmark that serves its results: an unquoted on: key, a document start
  marker, a session type, a job output that reads steps.<id>.outputs, a
  step's env:, and a step's ssh:. The output reads the step named
  benchmark, which has no id, so it loads, and compiling it warns that the
  output is empty.
source: https://github.com/parallelworks/activate-benchmark/blob/90418e4d017d55d12778c92ef51c70e02f5d7971/workflow.yaml
