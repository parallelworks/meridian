description: >-
  Conditions read the other inputs' defaults: pvc_persist defaults to false,
  so pvc_name is hidden, and its ignore, which reads that, ignores it. It has
  no value, and isn't required.
source: ACTIVATE's tests
inputs:
  targetType: kubernetes-cluster
  k8s:
    cluster: my-cluster
    volumes: {}
expect:
  inputs:
    targetType: kubernetes-cluster
    k8s:
      cluster: my-cluster
      volumes:
        pvc: New
        pvc_persist: false
