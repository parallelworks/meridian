description: >-
  A job's outputs are kept with the run, so an output made from a secret, or
  from a step's output that held a secret's value, keeps its value, as
  format 1 passes it to the jobs that need the job, but is private and a
  secret: it is kept only with the run's secrets, and the jobs that read it
  read it as a secret. So is a step's output that holds one. A value made
  from a plain variable is private.
source: Meridian
contexts:
  vars: {token: s3cret, region: eu}
secret-variables: [token]
jobs:
  main:
    steps:
      - {outcome: success, outputs: {KEY: key-s3cret}}
      - {outcome: success}
expect:
  values:
    /jobs/main/steps/0/run: echo KEY=key-s3cret >> $OUTPUTS
    /jobs/main/steps/1/run: echo eu
    /jobs/main/outputs/token: s3cret
    /jobs/main/outputs/key: key-s3cret
    /jobs/main/outputs/length: "6"
    /jobs/main/outputs/region: eu
  private:
    - /jobs/main/outputs/key
    - /jobs/main/outputs/length
    - /jobs/main/outputs/region
    - /jobs/main/outputs/token
  secret-outputs:
    - /jobs/main/outputs/key
    - /jobs/main/outputs/length
    - /jobs/main/outputs/token
    - /jobs/main/steps/0/outputs/KEY
