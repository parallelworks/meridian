description: >-
  A default that gives NaN or an infinity, as 0/0 and 1/0 do, gives a
  value that isn't JSON, which a run's values can't hold, so it is an error
  at the input, as a submitted value that isn't JSON is, for text inputs
  too. One in a list's rows is reported at the row's field. Text that holds
  the word NaN is fine.
