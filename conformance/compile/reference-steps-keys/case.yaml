description: >-
  steps.<id> has an earlier step's outputs, and nothing else. A step that
  reads a step the job doesn't have is an error, as ACTIVATE fails the
  step. Another key of one reads as null, and is a warning, as a bug fix to
  format 1: ACTIVATE read it as its own text.
source: Meridian
expect:
  diagnostics:
    - severity: warning
      code: steps_unknown_key
      path: /jobs/build/steps/1/run
      line: 6
      column: 23
      params: {id: compile, key: bogus}
    - severity: error
      code: undefined_step
      path: /jobs/build/steps/2/run
      line: 7
      column: 23
      params: {job: build, id: compil, suggested: "true", suggestion: compile}
