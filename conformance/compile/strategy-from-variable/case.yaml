description: >-
  A matrix is expanded as the run starts, not when it is created, so the
  plan holds its job once, with its strategy as it is written. One that
  reads a variable stays the expression that reads it, as a plan never
  holds a variable's value, and the plan names the variable, for the run to
  read as it starts.
source: Meridian
contexts:
  vars:
    SITES: "[1, 2]"
expect:
  plan:
    /jobs/0/key: probe
    /jobs/0/strategy/matrix/site/${{/0/src: " fromJSON(vars.SITES) "
    /run/variables: [vars.SITES]
