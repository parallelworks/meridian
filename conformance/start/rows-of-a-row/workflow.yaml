on:
  execute:
    inputs:
      hosts:
        type: list
        default:
          - ${{ fromJSON(vars.FIRST) }}
        template:
          name:
            type: string
          site:
            type: string
            default: east
      racks:
        type: list
        default:
          - {}
        template:
          disks:
            type: list
            default: ${{ fromJSON(org.DISKS) }}
            template:
              size:
                type: number
                default: 10
              label:
                type: string
jobs:
  main:
    steps:
      - run: echo ok
