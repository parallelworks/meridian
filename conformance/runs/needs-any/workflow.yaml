jobs:
  probe:
    strategy:
      # Not fail-fast, so that the instance that fails first cancels
      # none: the one that succeeds runs to its end, however they race.
      fail-fast: false
      matrix:
        n: [0, 1]
    steps:
      - run: test ${{ matrix.n }} = 1
  after:
    needs: [probe:any]
    steps:
      - run: echo probe ${{ needs.probe.result }}
