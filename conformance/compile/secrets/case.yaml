description: The plan names the secrets the run reads, secret variables and password inputs, and holds none of their values.
source: Meridian
contexts:
  vars:
    REGION: us-east
    API_KEY: unused
secret-variables: [API_KEY]
inputs:
  token: s3cret
expect:
  plan:
    /run/secrets: [inputs.token, vars.API_KEY]
    /run/inputs: {}
