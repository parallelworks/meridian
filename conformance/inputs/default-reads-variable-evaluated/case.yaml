description: >-
  A launch form evaluates a default that reads an organization or user
  variable, and sends what it gives. A submitted value that is what the
  default gives means the default, as its text does, and is what the
  default gives as the run starts: a number given as the text it gives, or
  as a number, is it too, and so is what a default gives that reads the
  variable through another input's default. Which values mean their
  defaults says something of the variable's value, so the run's secret
  record keeps it, and the plan holds none of them, as it holds no other
  value there, such as what the person typed in its place, or what a
  default that reads its own input gave once, which can hold the
  variable's value. Each is private, as the variable's value is, and kept
  as a secret where the variable is one.
source: Meridian
contexts:
  vars:
    REGION: us-east
    REPLICAS: "3"
    KEY: unused
  org:
    OWNER: research
secret-variables: [KEY]
inputs:
  region: us-east
  zone: us-east-a
  replicas: 3
  owner: someone-else
  mirror: us-east
  label: us-east
  key: typed-key
expect:
  # Create holds what a form sent in the place of a default that reads a
  # variable, whatever it is, and Start decides what it means.
  private:
    region: us-east
    zone: us-east-a
    replicas: 3
    mirror: us-east
    owner: someone-else
    label: us-east
  secrets:
    key: typed-key
