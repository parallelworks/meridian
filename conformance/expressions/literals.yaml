description: >-
  Literals: numbers, strings in three kinds of quotes, true, false and null in
  any case, and lists and mappings written as JSON. A word that is none of
  these and doesn't start with a context is a string.
source: ACTIVATE's documentation and tests
scope:
  contexts:
    inputs:
      type: slurm
      pvc: New
      currency: $
cases:
  - expr: "42"
    value: 42
  - expr: "-2.5e-3"
    value: -0.0025
  - expr: "2.5e-3"
    value: 0.0025
  - expr: 1e-2-1
    value: -0.99
  - expr: 0xff
    value: 255
  - expr: 0XFF
    value: 255
  # A word is a number as JavaScript's Number() reads a string: hexadecimal,
  # octal and binary whole numbers, and decimals beyond a float64's range as
  # infinities. A - before a hexadecimal, octal or binary number negates it.
  - expr: 0o17
    value: 15
  - expr: 0b101
    value: 5
  - expr: -0x10
    value: -16
  - expr: 017
    value: 17
  - expr: "5."
    value: 5
  - expr: 1e400
    value: .inf
  - expr: 0x10000000000000000
    value: 18446744073709551616
  - expr: NaN
    value: .nan
  - expr: Infinity
    value: .inf
  # Format 1 read these as Go reads numbers before: 1_000 was 1000, 0x1p4 was
  # 16, and inf, nan and infinity were numbers in any case. As JavaScript
  # reads them, they aren't numbers, so they are words.
  - expr: 1_000
    value: "1_000"
  - expr: inf
    value: inf
  - expr: nan
    value: nan
  - expr: infinity
    value: infinity
  - expr: 0x1p4
    value: "0x1p4"
  # As words, nan and inf decide a condition, since a word is never false;
  # NaN is a number, which is false.
  - expr: nan
    condition: true
    value: nan
    warnings: [0]
  - expr: inf
    condition: true
    value: inf
    warnings: [0]
  - expr: NaN
    condition: true
    value: .nan
    warnings: []

  - expr: "'it''s'"
    value: it's
  - expr: "''"
    value: ""
  - expr: '"double"'
    value: double
  - expr: "`back`"
    value: back
  - expr: '" hello ( 1 + 1 ) hello"'
    value: " hello ( 1 + 1 ) hello"
  - expr: '"a \n b"'
    value: 'a \n b'

  - expr: "true"
    value: true
  - expr: "True"
    value: true
  - expr: "FALSE"
    value: false
  - expr: "null"
    value: null
  - expr: "undefined"
    value: null

  - expr: '["list", "listhere"]'
    value: [list, listhere]
  - expr: '{"prop": 1}'
    value: {prop: 1}
  - expr: '{"exp1": {"exp1": 1, "exp2": 2}, "exp2": {"exp1": 1, "exp2": 2}}'
    value: {exp1: {exp1: 1, exp2: 2}, exp2: {exp1: 1, exp2: 2}}
  # A list or mapping that isn't JSON is a syntax error.
  - expr: "['a', 'b']"
    error: syntax
    code: invalid_json_literal
  - expr: "{a: 1}"
    error: syntax
    code: invalid_json_literal
  - expr: "[1, 2"
    error: syntax
    code: unclosed_bracket
  # A branch that isn't taken is still parsed, so it is an error there too.
  - expr: "true || ['a', 'b']"
    error: syntax
    code: invalid_json_literal
  - expr: "false && ['a', 'b']"
    error: syntax
    code: invalid_json_literal
  - expr: "true ? 1 : {a: 1}"
    error: syntax
    code: invalid_json_literal
  - expr: "inputs.type ?? {a: 1}"
    error: syntax
    code: invalid_json_literal
  - expr: "case(true, 1, ['a'])"
    error: syntax
    code: invalid_json_literal

  # Words are strings.
  - expr: inputs.pvc == New
    value: true
  - expr: inputs.pvc != New
    value: false
  - expr: inputs.type == SLURM
    value: false
  - expr: "inputs.missing ?? localhost"
    value: localhost
  - expr: "inputs.currency == $"
    value: true
  - expr: something
    value: something
  - expr: "true ? ubuntu:22.04 : rocky:9"
    value: ubuntu:22.04
  - expr: "true ? 12:30 : 13:00"
    value: "12:30"
  # A '-' between words is subtraction, so this compares with NaN.
  - expr: inputs.type == ior-standard
    value: false
  # A word with a dot that doesn't start with a context is text, which is
  # probably a mistake.
  - expr: input.type
    value: input.type
    warnings: [0]
  - expr: "inputs.type == secrets.TOKEN"
    value: false
    warnings: [15]
  # In a template, each is at its offset in the template.
  - template: "x ${{ input.type }} and ${{ inputs.type == secrets.TOKEN }}"
    value: x input.type and false
    warnings: [6, 43]
  - expr: inputs.pvc == New
    value: true
    warnings: []
