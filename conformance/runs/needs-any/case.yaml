description: >-
  A need on any instance of a matrix job is met once one instance
  succeeds, and the job that needs it reads that instance's result; the
  matrix job, which doesn't fail fast, fails, as one of its instances did,
  and the run with it.
source: Meridian
expect:
  run:
    outcome: failure
    jobs:
      probe:
        outcome: failure
      probe#0:
        outcome: failure
      probe#1:
        outcome: success
      after:
        outcome: success
        logs:
          - {step: 0, text: "probe success\n"}
