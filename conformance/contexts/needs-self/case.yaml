description: >-
  In a job's own steps and outputs, needs holds the job itself, whose outputs
  are those its steps have written so far, the later step's where two wrote
  the same name, and whose steps are its steps that have ids, as format 1
  reads them.
source: ACTIVATE's workflows, and Meridian
jobs:
  setup:
    steps:
      - {outcome: success, outputs: {PORT: "8080"}}
      - {outcome: success, outputs: {PORT: "9090", HOST: h}}
      - {outcome: success}
expect:
  values:
    /jobs/setup/steps/2/run: echo 9090 h 8080
    /jobs/setup/outputs/port: "8080"
    /jobs/setup/outputs/latest: "9090"
