description: >-
  A relative reference reads the workflow near the expression: .x is the key x
  beside the one the expression is in, each further dot goes up a level, and
  so does ../ (../x is ..x). An expression it reaches is evaluated, and a path
  that continues past it reads the expression's value. Expressions that read
  each other are an error.
source: ACTIVATE's tests
workflow:
  arrayhere: [one, two, three]
  field17: ${{ inputs.arrayhere }}
  field20: ${{ .field17 }}
  field21:
    prop: ${{ ..field17.0 }}
  field21b:
    prop: ${{ ..field17 get 0 }}
  field22:
    prop:
      prop2: ["${{ ....field17 get 2 }}", b]
  field23:
    prop:
      prop3: ${{ ...field22.prop.prop2.0 }}
    prop4:
      prop5: ${{ ..prop }}
  field23b: ${{ .field23.prop }}
  field23c:
    prop1: a
    prop2: ${{ .prop1 }}
    prop3:
      prop4: ${{ .prop5 }}
      prop5: ${{ ..prop2 }}
  field23d:
    - ["${{ ../../arrayhere.1 }}", "${{ ../../.arrayhere.2 }}"]
    - ${{ .[0] get 0 }}
    - ${{ .0 get 0 }}
  field24:
    group: {list: "${{ inputs.arrayhere }}", text: plain}
    item: ${{ .group.list.2 }}
    char: ${{ .group.text.0 }}
  computeOn: true
  options:
    field1:
      inner: ${{ !../../.computeOn }}
      far: ${{ ../../../../../x }}
  loop:
    a: ${{ .b }}
    b: ${{ .a }}
  self: ${{ .self }}
  numbered:
    "5": five
    half: ${{ .5 }}
    key: ${{ .[5] }}
    quoted: ${{ .['5'] }}
    deeper: {"5": {x: deep}, here: "${{ .5.x }}"}
    up:
      key: ${{ ..5 }}
scope:
  contexts:
    inputs:
      arrayhere: [one, two, three]
cases:
  - at: /field20
    value: [one, two, three]
  # The path past .field17 reads the template's value, so this is the list's
  # first item, not the template's first character. ACTIVATE agrees.
  - at: /field21/prop
    value: one
  - at: /field21b/prop
    value: one
  - at: /field22/prop/prop2/0
    value: three
  - at: /field23/prop/prop3
    value: three
  - at: /field23/prop4/prop5
    value: {prop3: three}
  - at: /field23b
    value: {prop3: three}
  - at: /field23c/prop2
    value: a
  - at: /field23c/prop3/prop4
    value: a
  - at: /field23c/prop3/prop5
    value: a
  - at: /field23d/0/0
    value: two
  - at: /field23d/0/1
    value: three
  # The item at index 0 beside this one is written .[0]. ACTIVATE's tests
  # wrote .0, which reads as the number 0 now, as in JavaScript, so get finds
  # nothing in it.
  - at: /field23d/1
    value: two
  - at: /field23d/2
    value: null
  # Through a mapping to a template, the path past it reads its value too.
  - at: /field24/item
    value: three
    warnings: []
  # Past plain text, the path reads a character of it.
  - at: /field24/char
    value: p
  - at: /options/field1/inner
    value: false
  - at: /options/field1/far
    value: null
  - at: /loop/a
    error: eval
    code: expressions_read_each_other
  - at: /self
    error: eval
    code: expressions_read_each_other
  # A word that starts with a dot and reads as a number is one, as in
  # JavaScript and as -.5 already was. Any other is a relative reference, and
  # a key named with digits is read in brackets. Format 1 read .5 as the key 5
  # before.
  - at: /numbered/half
    value: 0.5
  - at: /numbered/key
    value: five
  - at: /numbered/quoted
    value: five
  - at: /numbered/deeper/here
    value: deep
  - at: /numbered/up/key
    value: five
  - expr: .5
    value: 0.5
    warnings: []
  - expr: .5e1
    value: 5
  - expr: -.5
    value: -0.5
  - expr: .5e-1
    value: 0.05
  - expr: 1 + .5
    value: 1.5
  - expr: 1 + .5x
    value: 1
    warnings: []
  - expr: ..5
    value: null
    warnings: []
