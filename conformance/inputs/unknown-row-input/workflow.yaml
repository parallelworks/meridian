on:
  execute:
    inputs:
      creds:
        type: list
        template:
          user:
            type: string
          password:
            type: password
          ssh:
            type: group
            items:
              port:
                type: number
                default: 22
      workers:
        type: step
        title: Worker
        multi: true
        options:
          host:
            type: string
          key:
            type: password
jobs:
  main:
    steps:
      - run: echo ok
