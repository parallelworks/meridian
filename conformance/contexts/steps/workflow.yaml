jobs:
  main:
    steps:
      - id: first
        run: echo A=1 >> $OUTPUTS
      - run: echo ${{ steps.first.result }}
      - id: third
        run: echo ${{ steps.first }}
      - run: echo [${{ steps.first.outputs.B }}]
        if: always
    outputs:
      first: ${{ steps.first }}
      third: ${{ steps.third }}
      a: ${{ steps.first.outputs.A }}
