description: >-
  Operators written as words: in and includes test membership, startsWith and
  endsWith test strings, get reads a key, index or slice, range makes a list
  of whole numbers, and split and join convert between strings and lists. !
  before in, includes, startsWith or endsWith negates it.
source: ACTIVATE's documentation and tests
scope:
  contexts:
    inputs:
      arrayhere: [one, two, three]
      resource: {provider: aws}
      hosts: [h1, h2, h3]
      idx: 1
      name: Alice
      path: /usr/local/bin
      string: labtest
      csv: a,b,c,d
      list: [x, "y", z]
      jsonArr: "[1, 2, 3]"
      empty: ""
      count: 4
      countStr: "3"
      workers: [w0, w1, w2]
    env: {IDX: "2"}
cases:
  # From ACTIVATE's documentation.
  - expr: '["a", "b"] get 1'
    value: b
  - expr: '{"a": "c", "b": "d"} get a'
    value: c
  - expr: "'ab' get 0"
    value: a
  - expr: '"a" in ["a", "b"]'
    value: true
  - expr: '"b" in {"a": "c", "b": "d"}'
    value: true
  - expr: '"d" in {"a": "c", "b": "d"}'
    value: false
  - expr: '"hello" !in ["hello", "goodbye"]'
    value: false

  - expr: "'two' in inputs.arrayhere"
    value: true
  - expr: "'z' !in inputs.list"
    value: false
  - expr: "'provider' in inputs.resource"
    value: true
  - expr: "'zone' in inputs.resource"
    value: false
  - expr: "'zone' !in inputs.resource"
    value: true
  - expr: "'provider' in (inputs.resource)"
    value: true
  - expr: "'x' in ['xy', 'z']"
    error: syntax
    code: invalid_json_literal
  # A branch that isn't taken is still parsed, so it is an error there too.
  - expr: "false && 'x' in ['xy', 'z']"
    error: syntax
    code: invalid_json_literal
  - expr: '''x'' in ["xy", "z"]'
    value: false
  - expr: "'bt' in inputs.string"
    value: true
  # In a string, a number is found as its digits, as contains('123', 1)
  # finds it. Format 1 gave false before.
  - expr: "1 in '123'"
    value: true
  - expr: "inputs.arrayhere includes 'three'"
    value: true
  - expr: "inputs.arrayhere !includes 'three'"
    value: false
  - expr: "inputs.arrayhere !includes 'four'"
    value: true
  - expr: (inputs.resource) includes 'provider'
    value: true
  - expr: inputs.string includes "lab"
    value: true

  - expr: inputs.path startsWith "/usr"
    value: true
  - expr: inputs.path startsWith "/etc"
    value: false
  - expr: inputs.path endsWith "/bin"
    value: true
  - expr: inputs.path !startsWith "/etc"
    value: true
  - expr: inputs.path !endsWith ".sh"
    value: true
  - expr: inputs.path startsWith ""
    value: true
  - expr: "inputs.name startsWith 'A' == startsWith(inputs.name, 'A')"
    value: true
  # The word operators read null as "", as the functions do. Format 1's word
  # operators read it as "null" before, so the first was true.
  - expr: inputs.missing startsWith 'nu'
    value: false
  - expr: "startsWith(inputs.missing, 'nu')"
    value: false
  - expr: inputs.missing endsWith 'll'
    value: false
  - expr: "'abc' startsWith inputs.missing"
    value: true
  # In a string, null is "", which every string includes, as with
  # contains(). Format 1 gave false before. In a list, null matches only a
  # null item.
  - expr: "'abc' includes inputs.missing"
    value: true
  - expr: "inputs.missing in 'abc'"
    value: true
  - expr: "contains('abc', inputs.missing)"
    value: true
  - expr: '["a", null] includes inputs.missing'
    value: true
  - expr: '["a", ""] includes inputs.missing'
    value: false
  - expr: inputs.missing split ','
    value: [""]
  - expr: '["a", null] join "-"'
    value: a-
  - expr: "join([\"a\", null])"
    value: a,

  - expr: inputs.hosts get inputs.idx
    value: h2
  - expr: inputs.hosts get (inputs.idx)
    value: h2
  - expr: inputs.hosts get 1.7
    value: h2
  - expr: inputs.hosts get 7
    value: null
  - expr: inputs.workers get env.IDX
    value: w2
  - expr: '{"exp1": 1, "exp2": 2} get "exp2"'
    value: 2
  - expr: '[["exp1", "exp2"], ["exp3", "exp4"]] get 1 get 0'
    value: exp3
  - expr: "{\"a\": 1} get 'a'"
    value: 1
  - expr: '"hello" get 1:4'
    value: ell
  - expr: '"hello" get 2:(len "hello")'
    value: llo
  - expr: "[1,2,3,4] get 1:3"
    value: [2, 3]
  - expr: inputs.hosts get 0:2
    value: [h1, h2]
  - expr: inputs.name get (1):(3)
    value: li
  - expr: "inputs.hosts get (len inputs.hosts - 2):"
    value: [h2, h3]
  - expr: inputs.hosts get (0):2
    value: [h1, h2]
  - expr: "inputs.hosts get (0 - 1):"
    value: [h3]
  - expr: inputs.hosts get 1:(len inputs.hosts)
    value: [h2, h3]
  # A word that ends in : before a group makes text, the word and the group's
  # value, even when the word reads like a reference. Like any string an
  # expression builds, it is data: nothing is read at the path it spells.
  - expr: inputs.hosts.1:(2)
    value: inputs.hosts.1:2
  - expr: inputs.hosts.0:(inputs.idx)
    value: inputs.hosts.0:1
  - expr: env.IDX:(1)
    value: env.IDX:1
  - expr: map(inputs.hosts, h => h.0:(1))
    value: [h.0:1, h.0:1, h.0:1]
  - expr: inputs.hosts get 1:(2)
    value: [h2]

  - expr: 2 range 5
    value: [2, 3, 4]
  - expr: 1 range inputs.countStr
    value: [1, 2]
  - expr: 1 range inputs.count + 1
    value: [1, 2, 3, 4]
  - expr: -2 range 1
    value: [-2, -1, 0]
  - expr: 9007199254740992 range 9007199254740994
    error: eval
    code: range_out_of_bounds
  - expr: 5 range 6
    value: [5]
  - expr: 5 range 5
    value: []
  - expr: 5 range 1
    value: []
  - expr: 1 range 2.5
    error: eval
    code: range_not_whole
  - expr: 1 range "abc"
    error: eval
    code: range_not_whole
  - expr: 5 range 10006
    error: eval
    code: range_too_long

  - expr: inputs.csv split ","
    value: [a, b, c, d]
  - expr: inputs.path split "/"
    value: ["", usr, local, bin]
  - expr: inputs.empty split ","
    value: [""]
  - expr: '"abc" split ""'
    value: [a, b, c]
  - expr: '[] join ","'
    value: ""
  - expr: inputs.jsonArr join "+"
    value: 1+2+3
  - expr: (inputs.csv split ",") join "-"
    value: a-b-c-d
  - expr: length (inputs.csv split ",")
    value: 4
  - expr: inputs.list join "," + "!"
    value: x,y,z!
  - expr: (1 range 3) join ","
    value: "1,2"
  # A string joins to itself, as join('abc', ',') does. Format 1 gave ""
  # before.
  - expr: "'abc' join ','"
    value: abc

  # Each word operator gives what its function gives for the same arguments:
  # includes and in are contains, the one reversed, and startsWith, endsWith
  # and join are the functions of those names.
  # A number or a boolean is found in a string as its text, which for a
  # number is what JavaScript's String() writes. Format 1 gave false for the
  # word operators before.
  - expr: "'a1' includes 1"
    value: true
  - expr: "contains('a1', 1)"
    value: true
  - expr: "'x1e+21' includes 1e21"
    value: true
  - expr: "contains('x1e+21', 1e21)"
    value: true
  - expr: "1e21 in 'x1e+21'"
    value: true
  - expr: "'abc123' includes 123"
    value: true
  - expr: "contains('abc123', 123)"
    value: true
  - expr: "123 in 'abc123'"
    value: true
  - expr: "'abc' includes true"
    value: false
  - expr: "contains('abc', true)"
    value: false
  - expr: "'a true b' includes true"
    value: true
  - expr: "contains('a true b', true)"
    value: true
  - expr: "inputs.list includes 'y'"
    value: true
  - expr: "contains(inputs.list, 'y')"
    value: true
  - expr: "[1, 2] includes '1'"
    value: true
  - expr: "contains([1, 2], '1')"
    value: true
  - expr: "inputs.missing includes 'a'"
    value: false
  - expr: "contains(inputs.missing, 'a')"
    value: false
  - expr: "inputs.count includes 4"
    value: false
  - expr: "contains(inputs.count, 4)"
    value: false
  - expr: "inputs.jsonArr includes '2'"
    value: true
  - expr: "contains(inputs.jsonArr, '2')"
    value: true
  # All three look in a mapping's keys, as JavaScript's in does.
  - expr: "inputs.resource includes 'provider'"
    value: true
  - expr: "contains(inputs.resource, 'provider')"
    value: true
  - expr: "contains(inputs.resource, 'aws')"
    value: false

  - expr: "12345 startsWith 12"
    value: true
  - expr: "startsWith(12345, 12)"
    value: true
  - expr: "inputs.list startsWith '['"
    value: true
  - expr: "startsWith(inputs.list, '[')"
    value: true
  - expr: "inputs.missing startsWith ''"
    value: true
  - expr: "startsWith(inputs.missing, '')"
    value: true
  - expr: "true endsWith 'ue'"
    value: true
  - expr: "endsWith(true, 'ue')"
    value: true
  - expr: "inputs.name endsWith inputs.missing"
    value: true
  - expr: "endsWith(inputs.name, inputs.missing)"
    value: true

  - expr: inputs.list join "-"
    value: x-y-z
  - expr: join(inputs.list, "-")
    value: x-y-z
  - expr: inputs.jsonArr join "-"
    value: 1-2-3
  - expr: join(inputs.jsonArr, "-")
    value: 1-2-3
  - expr: inputs.name join "-"
    value: Alice
  - expr: join(inputs.name, "-")
    value: Alice
  - expr: inputs.missing join "-"
    value: ""
  - expr: join(inputs.missing, "-")
    value: ""
  - expr: inputs.count join "-"
    value: ""
  - expr: join(inputs.count, "-")
    value: ""
  - expr: inputs.resource join "-"
    value: ""
  - expr: join(inputs.resource, "-")
    value: ""
