jobs:
  main:
    env:
      TOKEN: ${{ vars.token }}
    steps:
      - id: login
        run: echo KEY=key-${{ env.TOKEN }} >> $OUTPUTS
      - run: echo ${{ vars.region }}
    outputs:
      token: ${{ vars.token }}
      key: ${{ steps.login.outputs.KEY }}
      length: ${{ length(env.TOKEN) }}
      region: ${{ vars.region }}
