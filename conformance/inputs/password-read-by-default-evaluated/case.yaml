description: >-
  A launch form evaluates each default it can and sends what it gives, a
  default that reads a password too, and sends the text only of what it
  can't evaluate. A submitted value that is what an input's default, or one
  of its options, gives, when that reads a password, means the default, as
  its text does: it is made from the password, so it stays an expression
  until the run is underway, in a list's row too. Any other value is data,
  as typed text is.
source: Meridian
inputs:
  pw: HUNTER2SECRET
  copy: HUNTER2SECRET
  dsn: postgres://app:HUNTER2SECRET@db
  choice: HUNTER2SECRET
  tags: [plain, HUNTER2SECRET]
  creds:
    - user: a
      pass: HUNTER2SECRET
      hint: HUNTER2SECRET
  note: typed
expect:
  inputs:
    note: typed
  deferred:
    copy: ${{ inputs.pw }}
    dsn: postgres://app:${{ inputs.pw }}@db
    choice: ${{ inputs.pw }}
    tags: [plain, "${{ inputs.pw }}"]
    creds:
      - user: a
        hint: ${{ inputs.creds.[index].pass }}
  secrets:
    pw: HUNTER2SECRET
    creds.0.pass: HUNTER2SECRET
