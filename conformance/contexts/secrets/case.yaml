description: >-
  A job's outputs are kept with the run, so an output made from a secret is
  masked whole, and so is one made from a step's output that held a
  secret's value, each with a warning that names it. A value made from a
  plain variable isn't masked, but is private: it is kept only with the
  run's secrets.
source: Meridian
contexts:
  vars: {token: s3cret, region: eu}
secret-variables: [token]
jobs:
  main:
    steps:
      - {outcome: success, outputs: {KEY: key-s3cret}}
      - {outcome: success}
expect:
  diagnostics:
    - severity: warning
      code: output_masked
      path: /jobs/main/outputs/token
      params: {name: token}
    - severity: warning
      code: output_masked
      path: /jobs/main/outputs/key
      params: {name: key}
    - severity: warning
      code: output_masked
      path: /jobs/main/outputs/length
      params: {name: length}
  values:
    /jobs/main/steps/0/run: echo KEY=key-s3cret >> $OUTPUTS
    /jobs/main/steps/1/run: echo eu
    /jobs/main/outputs/token: "***"
    /jobs/main/outputs/key: "***"
    /jobs/main/outputs/length: "***"
    /jobs/main/outputs/region: eu
  private:
    - /jobs/main/outputs/region
