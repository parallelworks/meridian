description: >-
  A launch form evaluates each default it can and sends what it gives, a
  default that reads a password too, and sends the text only of what it
  can't evaluate. A submitted value that is what an input's default, or one
  of its options, gives, when that reads a password, means the default, as
  its text does: it is made from the password, so it stays an expression
  until the run is underway, in a list's row too. Any other value there,
  such as what the form gave before the password changed, or what the
  person typed in its place, can hold the password too, so it is kept as a
  secret.
source: Meridian
inputs:
  pw: HUNTER2SECRET
  copy: HUNTER2SECRET
  dsn: postgres://app:HUNTER2SECRET@db
  choice: HUNTER2SECRET
  tags: [plain, HUNTER2SECRET]
  creds:
    - user: a
      pass: HUNTER2SECRET
      hint: HUNTER2SECRET
    - user: b
      pass: HUNTER3SECRET
      hint: HUNTER3SECRET
  note: typed
expect:
  # Create holds what a form sent in the place of a default that reads a
  # password, whatever it is, and Start decides what it means.
  inputs:
    tags: [plain, null]
    creds:
      - user: a
      - user: b
  secrets:
    pw: HUNTER2SECRET
    copy: HUNTER2SECRET
    dsn: postgres://app:HUNTER2SECRET@db
    choice: HUNTER2SECRET
    tags.1: HUNTER2SECRET
    creds.0.pass: HUNTER2SECRET
    creds.0.hint: HUNTER2SECRET
    creds.1.pass: HUNTER3SECRET
    creds.1.hint: HUNTER3SECRET
    note: typed
