description: >-
  steps holds, for each step that has an id and has had its turn, the
  outputs it wrote, as strings. A step reads those before it, and the job's
  outputs read them all. A name it didn't write reads as "" in a step whose
  if: is the word always, and fails anywhere else (output_not_written).
source: Meridian
jobs:
  main:
    steps:
      - {outcome: success, outputs: {A: "1"}}
      - {outcome: success, outputs: {C: "3"}}
      - {outcome: success, outputs: {D: "4"}}
      - {outcome: success}
expect:
  diagnostics:
    - severity: warning
      code: older_always
      path: /jobs/main/steps/3/if
  values:
    /jobs/main/steps/2/run: 'echo {"outputs":{"A":"1"}}'
    /jobs/main/steps/3/run: echo []
    /jobs/main/outputs/first: '{"outputs":{"A":"1"}}'
    /jobs/main/outputs/third: '{"outputs":{"D":"4"}}'
    /jobs/main/outputs/a: "1"
