description: A value that isn't a number, or is outside the input's min and max, is an error.
source: Meridian
inputs:
  count: 9
  other: many
expect:
  diagnostics:
    - severity: error
      code: input_above_max
      path: /on/execute/inputs/count
    - severity: error
      code: input_not_number
      path: /on/execute/inputs/other
