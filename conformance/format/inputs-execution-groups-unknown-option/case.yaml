description: >-
  An execution-groups input option the format doesn't define is an unknown
  key. ACTIVATE's schema rejects this, but ACTIVATE ignores the key when it
  runs the workflow, so format 1 warns and ignores it.
source: ACTIVATE's workflow schema tests
expect:
  diagnostics:
    - severity: warning
      code: unknown_key
      path: /on/execute/inputs/executionGroup/multi
      line: 10
      column: 9
