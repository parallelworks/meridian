on:
  execute:
    inputs:
      name:
        type: string
        default: web
      cluster:
        type: kubernetes-clusters
        default:
          name: ${{ inputs.name }}
          labels: ["${{ inputs.name }}", fixed]
      auth:
        type: kubernetes-clusters
        default:
          token: ${{ vars.TOKEN }}
          user: ${{ inputs.name }}
jobs:
  main:
    steps:
      - run: echo ok
