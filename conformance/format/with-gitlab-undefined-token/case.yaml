description: >-
  A $ key ACTIVATE doesn't define is an unknown key: $token isn't one, and no
  input can start with $. ACTIVATE's schema rejects this, but ACTIVATE ignores
  the key when it runs the workflow, so format 1 warns and ignores it.
source: ACTIVATE's workflow schema tests
expect:
  diagnostics:
    - severity: warning
      code: unknown_key
      path: /jobs/main/steps/0/with/$token
      line: 7
      column: 11
