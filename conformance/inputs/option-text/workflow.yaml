on:
  execute:
    inputs:
      home:
        type: string
        default: us-east
      region:
        type: dropdown
        options:
          - label: My region
            value: ${{ inputs.home }}
          - label: us-west
            value: us-west
      regions:
        type: multi-dropdown
        options:
          - label: My region
            value: ${{ inputs.home }}
          - label: us-west
            value: us-west
      site:
        type: string
        default: east
      grouped:
        type: dropdown
        option-key: ${{ inputs.site }}
        options:
          east:
            - label: My region
              value: ${{ inputs.home }}
          west:
            - label: us-west
              value: us-west
      note:
        type: string
jobs:
  main:
    steps:
      - run: echo ok
