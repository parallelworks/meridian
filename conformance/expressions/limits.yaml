description: >-
  A template, a ${{ }} alone or text with ${{ }} in it, builds at most 8 MiB,
  8,388,608 bytes, and does at most 32 MiB of work, 33,554,432 bytes. Each
  operation counts the size of what it makes: a string its bytes, and a list
  8 for each item and each item's size. range counts 16 for each number;
  join, +, upper, lower and toJSON the string they make; format its string,
  once; split the string's bytes and 8 for each part; fromJSON the value it
  reads; map 8 for each item it makes and the item's size, and filter the
  same for each item it keeps; the slice operands the text they make; and a
  template's text each value's text, but not the text around them. keys,
  values and trim build nothing. Work counts 8 for each operand, operator
  and call evaluated, for each name, index or * of a path followed, for each
  item a .* visits, from which the rest of the path is followed, and for
  each run of a lambda, and nothing for parentheses that only group or for
  what isn't evaluated. A name read to look something up, of a path or a
  lambda's parameter, counts its bytes instead, if they are more than 8. An
  operation that reads a value counts its size: a
  comparison, contains, in, includes, startsWith and endsWith both
  operands; length a string; trim, upper, lower, keys, values, toJSON and
  fromJSON their operand; format, join and split their arguments; a list or
  mapping written as JSON, each time it is evaluated; a name, an index or
  get that reads into a string, the string, and get a key that is text;
  arithmetic, -, abs, floor, ceil, round and range a string they convert to
  a number; and map, filter and .* a string they go through, and a
  mapping's keys, 8 for each and its bytes. A string read as the JSON it
  holds counts the value it holds too. What a template builds counts as
  work too. Neither count includes reading a template, which has its own
  counts. Each case's template builds exactly 8 MiB or does exactly 32 MiB
  of work, or a byte more, which is an error.
source: Meridian
workflow:
  # B, as in the cases of + below, counts 4,222,760, its text 4,165,844 and
  # the text of 'abcd' 4: 8,388,608. The text around them is free.
  text: "(${{ (1000 range 4011) join ((100 range 560) join '') }}, ${{ 'abcd' }})"
  over: "(${{ (1000 range 4011) join ((100 range 560) join '') }}, ${{ 'abcde' }})"
  # Reading .text counts nothing, as it has its own count, and + makes its
  # 4,165,852 bytes.
  read: ${{ length(.text + '') }}
  read-over: ${{ length(.over) }}
  # heavy does 32 MiB of work, as the cases below do with no T, and reading
  # it counts nothing toward a reader's work: reads-heavy reads it, and does
  # 32 MiB of its own. reads-rows reads rows, and .* visits its 3 items.
  heavy: "${{ map(((1000 range 10000) join '') split ',', b => length(filter(range 460, i => b < b)) + !(range 1009) + ('abcdefghijklmno' < '')) }}"
  heavy-over: "${{ map(((1000 range 10000) join '') split ',', b => length(filter(range 460, i => b < b)) + !(range 1009) + ('abcdefghijklmnop' < '')) }}"
  rows: "${{ fromJSON('[{\"a\": 1}, {\"a\": 2}, {}]') }}"
  reads-heavy: "${{ map(((1000 range 10000) join '') split ',', b => length(.heavy) + length(filter(range 460, i => b < b)) + !(range 1007) + ('abcdefghijklmno' < '')) }}"
  reads-heavy-over: "${{ map(((1000 range 10000) join '') split ',', b => length(.heavy) + length(filter(range 460, i => b < b)) + !(range 1007) + ('abcdefghijklmnop' < '')) }}"
  reads-rows: "${{ map(((1000 range 10000) join '') split ',', b => length(.rows.*.a) + length(filter(range 460, i => b < b)) + !(range 1004) + ('abcdefg' < '')) }}"
  reads-rows-over: "${{ map(((1000 range 10000) join '') split ',', b => length(.rows.*.a) + length(filter(range 460, i => b < b)) + !(range 1004) + ('abcdefgh' < '')) }}"
  on:
    execute:
      inputs:
        heavy:
          type: string
          default: "${{ map(((1000 range 10000) join '') split ',', b => length(filter(range 460, i => b < b)) + !(range 1009) + ('abcdefghijklmno' < '')) }}"
        # reads-default's default reads the default of input heavy, another
        # template that does 32 MiB.
        reads-default:
          type: string
          default: "${{ map(((1000 range 10000) join '') split ',', b => length(inputs.heavy.default) + length(filter(range 460, i => b < b)) + !(range 1007) + ('abcdefg' < '')) }}"
        reads-default-over:
          type: string
          default: "${{ map(((1000 range 10000) join '') split ',', b => length(inputs.heavy.default) + length(filter(range 460, i => b < b)) + !(range 1007) + ('abcdefgh' < '')) }}"
scope:
  contexts:
    inputs:
      a: {b: 1}
      s: abc
      t: '12'
      j: '[1, "ab"]'
      o: '{"k": 1}'
      jw: '["ab", "c"]'
      a_long_input_name: 1
      a long quoted key: 2
      l: [{a: 1}, {a: 2}, {}]
      m: {x: {a: 1}, y: {a: 2}}
      w: [ab, c]
    vars: {}
cases:
  # 100 range 575 makes 475 numbers, 7,600 bytes, and joining them with ''
  # makes their 3 digits each, 1,425. 1000 range 6800 makes 5,800 numbers,
  # 92,800, and joining them with those 1,425 bytes makes their 4 digits each
  # and 5,799 separators, 23,200 + 8,263,575 = 8,286,775. upper 'abcdefgh'
  # makes 8. Together, 8,388,608.
  - expr: "length(join(1000 range 6800, join(100 range 575, ''))) + length(upper 'abcdefgh')"
    value: 8286783
  - expr: "length(join(1000 range 6800, join(100 range 575, ''))) + length(upper 'abcdefghi')"
    error: eval
  - expr: "length((1000 range 6800) join ((100 range 575) join '')) + length(upper 'abcdefgh')"
    value: 8286783
  - expr: "length((1000 range 6800) join ((100 range 575) join '')) + length(upper 'abcdefghi')"
    error: eval
  - expr: >-
      length(join(1000 range 6800, join(100 range 575, ''))) + length(upper 'abcdefgh')
      + length(keys({"a": 1})) + length(values({"a": 1})) + length(trim ' a ')
    value: 8286786

  # B, (1000 range 4011) join ((100 range 560) join ''), counts 7,360 and
  # 1,380 for the inner range and join, and 48,176 and 4,165,844 for the
  # outer ones: 4,222,760. B + 'abcd' makes 4,165,848: 8,388,608.
  - expr: "length((1000 range 4011) join ((100 range 560) join '') + 'abcd')"
    value: 4165848
  - expr: "length((1000 range 4011) join ((100 range 560) join '') + 'abcde')"
    error: eval
  # upper B and lower B make 4,165,844, and upper 'abcd' 4.
  - expr: "length(upper((1000 range 4011) join ((100 range 560) join ''))) + length(upper 'abcd')"
    value: 4165848
  - expr: "length(upper((1000 range 4011) join ((100 range 560) join ''))) + length(upper 'abcde')"
    error: eval
  - expr: "length(lower((1000 range 4011) join ((100 range 560) join ''))) + length(lower 'abcd')"
    value: 4165848
  - expr: "length(lower((1000 range 4011) join ((100 range 560) join ''))) + length(lower 'abcde')"
    error: eval
  # toJSON(B) makes B in quotes, 4,165,846, and upper 'ab' 2.
  - expr: "length(toJSON((1000 range 4011) join ((100 range 560) join ''))) + length(upper 'ab')"
    value: 4165848
  - expr: "length(toJSON((1000 range 4011) join ((100 range 560) join ''))) + length(upper 'abc')"
    error: eval
  - at: /read
    value: 4165852
  - at: /read-over
    error: eval

  # B, (1000 range 4136) join ((100 range 394) join ''), counts 4,704 + 882 +
  # 50,176 + 2,777,614 = 2,833,376. format makes B twice and abcd, and counts
  # that once: 5,555,232. Together, 8,388,608.
  - expr: "length(format('{0}{0}abcd', (1000 range 4136) join ((100 range 394) join '')))"
    value: 5555232
  - expr: "length(format('{0}{0}abcde', (1000 range 4136) join ((100 range 394) join '')))"
    error: eval
  # toJSON(B) makes 2,777,616, fromJSON reads B, 2,777,614, and upper 'ab'
  # makes 2.
  - expr: "length(fromJSON(toJSON((1000 range 4136) join ((100 range 394) join '')))) + length(upper 'ab')"
    value: 2777616
  - expr: "length(fromJSON(toJSON((1000 range 4136) join ((100 range 394) join '')))) + length(upper 'abc')"
    error: eval

  # B, (1000 range 3025) join ((100 range 358) join '-'), counts 4,128 + 1,031
  # + 32,400 + 2,094,844 = 2,132,403. B has 2,024 × 257 dashes, so split '-'
  # makes 520,169 parts, and counts B's 2,094,844 bytes and 8 for each part:
  # 6,256,196. upper 'abcdefghi' makes 9. Together, 8,388,608.
  - expr: "length(((1000 range 3025) join ((100 range 358) join '-')) split '-') + length(upper 'abcdefghi')"
    value: 520178
  - expr: "length(((1000 range 3025) join ((100 range 358) join '-')) split '-') + length(upper 'abcdefghij')"
    error: eval
  # B, (1000 range 2663) join ((1000 range 1100) join '-'), counts 1,600 + 499
  # + 26,608 + 835,990 = 864,697. split '' makes a part of each character, and
  # counts 9 for each: 7,523,910. An empty string has no characters, so
  # '' split '' counts nothing. upper 'a' makes 1. Together, 8,388,608.
  - expr: "length(((1000 range 2663) join ((1000 range 1100) join '-')) split '') + length('' split '') + length(upper 'a')"
    value: 835991
  - expr: "length(((1000 range 2663) join ((1000 range 1100) join '-')) split '') + length('' split '') + length(upper 'ab')"
    error: eval

  # map counts 8 for each item it makes and the item's size. B,
  # (1000 range 1238) join '', counts 3,808 + 952, and split ',' makes [B],
  # 960. range 8589 counts 137,424, and the inner map makes 8,589 items of
  # B's 952 bytes, 8,245,440. The outer map makes a list of one number, 16,
  # and upper 'abcdefgh' 8. Together, 8,388,608.
  - expr: "map(((1000 range 1238) join '') split ',', b => length(map(range 8589, i => b)))[0] + length(upper 'abcdefgh')"
    value: 8597
  - expr: "map(((1000 range 1238) join '') split ',', b => length(map(range 8589, i => b)))[0] + length(upper 'abcdefghi')"
    error: eval
  # filter counts 8 for each item it keeps and the item's size, and nothing
  # for an item it doesn't keep. B, (1000 range 1131) join '', counts 2,096 +
  # 524, and split ',' makes [B], 532. range 9413 counts 150,608, map makes
  # 9,413 items of B's 524 bytes, 5,007,716, and filter keeps 6,066 of them,
  # 3,227,112. The outer map makes 16, and upper 'abcd' 4. Together,
  # 8,388,608.
  - expr: "map(((1000 range 1131) join '') split ',', b => length(filter(map(range 9413, i => b), (x, j) => j < 6066)))[0] + length(upper 'abcd')"
    value: 6070
  - expr: "map(((1000 range 1131) join '') split ',', b => length(filter(map(range 9413, i => b), (x, j) => j < 6066)))[0] + length(upper 'abcde')"
    error: eval

  # The cases below do exactly 32 MiB of work, 33,554,432 bytes, and each
  # has a twin with a letter more, a byte over, which is an error. Each is
  #
  #   map(((1000 range 10000) join '') split ',', b => T + length(filter(range K, i => b < b)) + !(range M) + ('…' < ''))
  #
  # where T is what the case pins, with its count in the case's comment, and
  # b is B, the digits of the numbers from 1000 to 9999: 36,000 bytes. The
  # rest counts:
  # - map 8, its run 8, and the list of one number it makes, 16;
  # - 1000 range 10000: range, 1000 and 10000, 24, and 9,000 numbers built,
  #   144,000; join and '', 16, reading the list, 144,000, and building B,
  #   36,000; split and ',', 16, reading B and ',', 36,001, and building
  #   [B], 36,008: 396,065 in all;
  # - the body's three +, 24;
  # - length(filter(range K, i => b < b)): length, filter, range and K, 32,
  #   K numbers built, 16 each, and K runs, 8 each, whose b < b counts 24
  #   and reads b twice, 72,000: 32 + 72,048 × K;
  # - !(range M): !, range and M, 24, and M numbers built, 16 each;
  # - ('…' < ''): 24, and reading the letters, a byte each.
  # So T + 396,201 + 72,048 × K + 16 × M + the letters is 33,554,432.
  # With no T, and no + before it: K is 460, M 1,009, with 15 letters.
  - expr: "map(((1000 range 10000) join '') split ',', b => length(filter(range 460, i => b < b)) + !(range 1009) + ('abcdefghijklmno' < ''))"
    value: [0]
  - expr: "map(((1000 range 10000) join '') split ',', b => length(filter(range 460, i => b < b)) + !(range 1009) + ('abcdefghijklmnop' < ''))"
    error: eval
  # A template's expressions share its count, and what it builds counts as
  # work: the text of the first value, [0], 3, and 'abcd', 8 and its text, 4.
  # The text around them counts nothing. With no T: K is 460, M 1,009, with no
  # letters.
  - template: "(${{ map(((1000 range 10000) join '') split ',', b => length(filter(range 460, i => b < b)) + !(range 1009) + ('' < '')) }}, ${{ 'abcd' }})"
    value: "([0], abcd)"
  - template: "(${{ map(((1000 range 10000) join '') split ',', b => length(filter(range 460, i => b < b)) + !(range 1009) + ('' < '')) }}, ${{ 'abcde' }})"
    error: eval
  # Parentheses that only group count nothing: T is one operand, 8. K is 460,
  # M 1,008, with 15 letters.
  - expr: "map(((1000 range 10000) join '') split ',', b => ((((1)))) + length(filter(range 460, i => b < b)) + !(range 1008) + ('abcdefghijklmno' < ''))"
    value: [1]
  - expr: "map(((1000 range 10000) join '') split ',', b => ((((1)))) + length(filter(range 460, i => b < b)) + !(range 1008) + ('abcdefghijklmnop' < ''))"
    error: eval
  # Each operand counts 8, a number, a string, true and a bare word alike, and
  # each && 8: 72. K is 460, M 1,004, with 15 letters.
  - expr: "map(((1000 range 10000) join '') split ',', b => (1 && 'a' && true && word && 2) + length(filter(range 460, i => b < b)) + !(range 1004) + ('abcdefghijklmno' < ''))"
    value: [2]
  - expr: "map(((1000 range 10000) join '') split ',', b => (1 && 'a' && true && word && 2) + length(filter(range 460, i => b < b)) + !(range 1004) + ('abcdefghijklmnop' < ''))"
    error: eval
  # -5 is a number, one operand, and - 5 is - applied to 5, two steps; with +,
  # 32. K is 460, M 1,007, with 7 letters.
  - expr: "map(((1000 range 10000) join '') split ',', b => (-5 + - 5) + length(filter(range 460, i => b < b)) + !(range 1007) + ('abcdefg' < ''))"
    value: [-10]
  - expr: "map(((1000 range 10000) join '') split ',', b => (-5 + - 5) + length(filter(range 460, i => b < b)) + !(range 1007) + ('abcdefgh' < ''))"
    error: eval
  # null, ?? and 3, 24. K is 460, M 1,007, with 15 letters.
  - expr: "map(((1000 range 10000) join '') split ',', b => (null ?? 3) + length(filter(range 460, i => b < b)) + !(range 1007) + ('abcdefghijklmno' < ''))"
    value: [3]
  - expr: "map(((1000 range 10000) join '') split ',', b => (null ?? 3) + length(filter(range 460, i => b < b)) + !(range 1007) + ('abcdefghijklmnop' < ''))"
    error: eval
  # A reference counts 8, and 8 for each name or index of its path: 24, 24 and
  # 32. vars.missing is "", 16, and length reads it, 0, 8 for itself. With
  # three +, 128. K is 460, M 1,001, with 7 letters.
  - expr: "map(((1000 range 10000) join '') split ',', b => (inputs.a.b + inputs['a']['b'] + inputs.l[1].a + length(vars.missing)) + length(filter(range 460, i => b < b)) + !(range 1001) + ('abcdefg' < ''))"
    value: [4]
  - expr: "map(((1000 range 10000) join '') split ',', b => (inputs.a.b + inputs['a']['b'] + inputs.l[1].a + length(vars.missing)) + length(filter(range 460, i => b < b)) + !(range 1001) + ('abcdefgh' < ''))"
    error: eval
  # Each name of a path counts, whether or not the path leads anywhere:
  # inputs.missing.b.c is 32, and with ?? and 1, 48. inputs.missing.*.a is 8,
  # and 8 each for missing and *, which visits nothing; with length, 32. With
  # +, 88. K is 460, M 1,003, with 15 letters.
  - expr: "map(((1000 range 10000) join '') split ',', b => ((inputs.missing.b.c ?? 1) + length(inputs.missing.*.a)) + length(filter(range 460, i => b < b)) + !(range 1003) + ('abcdefghijklmno' < ''))"
    value: [1]
  - expr: "map(((1000 range 10000) join '') split ',', b => ((inputs.missing.b.c ?? 1) + length(inputs.missing.*.a)) + length(filter(range 460, i => b < b)) + !(range 1003) + ('abcdefghijklmnop' < ''))"
    error: eval
  # length 8, map 8 and inputs.l 16. Each of 3 runs counts 8, and x.a 16. map
  # makes 3 items, 16 each: 152. K is 460, M 999, with 15 letters.
  - expr: "map(((1000 range 10000) join '') split ',', b => length(map(inputs.l, (x, k) => x.a)) + length(filter(range 460, i => b < b)) + !(range 999) + ('abcdefghijklmno' < ''))"
    value: [3]
  - expr: "map(((1000 range 10000) join '') split ',', b => length(map(inputs.l, (x, k) => x.a)) + length(filter(range 460, i => b < b)) + !(range 999) + ('abcdefghijklmnop' < ''))"
    error: eval
  # length 8, filter 8 and inputs.l 16. Each of 3 runs counts 8, and k > 5 24
  # and reads two numbers, 16: 176. K is 460, M 998, with 7 letters.
  - expr: "map(((1000 range 10000) join '') split ',', b => length(filter(inputs.l, (x, k) => k > 5)) + length(filter(range 460, i => b < b)) + !(range 998) + ('abcdefg' < ''))"
    value: [0]
  - expr: "map(((1000 range 10000) join '') split ',', b => length(filter(inputs.l, (x, k) => k > 5)) + length(filter(range 460, i => b < b)) + !(range 998) + ('abcdefgh' < ''))"
    error: eval
  # A path after a computed value is an operand, 8, and 8 for each name:
  # (inputs.a).b is 8 + 16 + 8. fromJSON('{"c": 2}').c is 8, fromJSON 8 and
  # its text 8, reading the text, 8, building {"c": 2}, 17, and c 8: 57. With
  # +, 97. K is 460, M 1,003, with 6 letters.
  - expr: "map(((1000 range 10000) join '') split ',', b => ((inputs.a).b + fromJSON('{\"c\": 2}').c) + length(filter(range 460, i => b < b)) + !(range 1003) + ('abcdef' < ''))"
    value: [3]
  - expr: "map(((1000 range 10000) join '') split ',', b => ((inputs.a).b + fromJSON('{\"c\": 2}').c) + length(filter(range 460, i => b < b)) + !(range 1003) + ('abcdefg' < ''))"
    error: eval
  # The slice operands (0):(2) and (1): are an operand each, 8, besides 0, 2
  # and 1, and build their text, 0:2 and 1:, 3 and 2. get reads the string it
  # reads into, abc, 3, and its key, which is text, 3 and 2. With get 8,
  # inputs.s 16, and length 8, which reads ab and bc, 2 each: 67 and 57. With
  # +, 132. K is 460, M 1,001, with 3 letters.
  - expr: "map(((1000 range 10000) join '') split ',', b => (length(inputs.s get (0):(2)) + length(inputs.s get (1):)) + length(filter(range 460, i => b < b)) + !(range 1001) + ('abc' < ''))"
    value: [4]
  - expr: "map(((1000 range 10000) join '') split ',', b => (length(inputs.s get (0):(2)) + length(inputs.s get (1):)) + length(filter(range 460, i => b < b)) + !(range 1001) + ('abcd' < ''))"
    error: eval
  # The slice operand 1:(3) is an operand, 8, besides 3, 8, and builds 1:3, 3,
  # which get reads as its key, 3. length 8, get 8 and inputs.l 16: 54. K is
  # 460, M 1,006, with 1 letter.
  - expr: "map(((1000 range 10000) join '') split ',', b => length(inputs.l get 1:(3)) + length(filter(range 460, i => b < b)) + !(range 1006) + ('a' < ''))"
    value: [2]
  - expr: "map(((1000 range 10000) join '') split ',', b => length(inputs.l get 1:(3)) + length(filter(range 460, i => b < b)) + !(range 1006) + ('ab' < ''))"
    error: eval
  # (inputs.w):(b) builds its text, ["ab","c"]:B, 36,011, which length reads:
  # the slice, inputs.w and b 32, length 8, and 72,022: 72,062. K is 459, M
  # 1,008, with 9 letters.
  - expr: "map(((1000 range 10000) join '') split ',', b => length((inputs.w):(b)) + length(filter(range 459, i => b < b)) + !(range 1008) + ('abcdefghi' < ''))"
    value: [36011]
  - expr: "map(((1000 range 10000) join '') split ',', b => length((inputs.w):(b)) + length(filter(range 459, i => b < b)) + !(range 1008) + ('abcdefghij' < ''))"
    error: eval
  # !, -, abs, floor, ceil and round count 8 each, and read nothing: 16 with
  # each operand. length(range 3) is 8 + 8 + 8, and 3 numbers built, 48. With
  # six +, 216. K is 460, M 995, with 15 letters.
  - expr: "map(((1000 range 10000) join '') split ',', b => (!0 + -(1) + abs -2 + floor 1.5 + ceil 1.5 + round 1.5 + length(range 3)) + length(filter(range 460, i => b < b)) + !(range 995) + ('abcdefghijklmno' < ''))"
    value: [10]
  - expr: "map(((1000 range 10000) join '') split ',', b => (!0 + -(1) + abs -2 + floor 1.5 + ceil 1.5 + round 1.5 + length(range 3)) + length(filter(range 460, i => b < b)) + !(range 995) + ('abcdefghijklmnop' < ''))"
    error: eval
  # 11 operands and 10 operators, which read nothing: 168. K is 460, M 998,
  # with 15 letters.
  - expr: "map(((1000 range 10000) join '') split ',', b => (1 + 2 - 3 * 4 / 5 // 6 % 7 mod 8 ** 1 ^ 1 exp 1) + length(filter(range 460, i => b < b)) + !(range 998) + ('abcdefghijklmno' < ''))"
    value: [3]
  - expr: "map(((1000 range 10000) join '') split ',', b => (1 + 2 - 3 * 4 / 5 // 6 % 7 mod 8 ** 1 ^ 1 exp 1) + length(filter(range 460, i => b < b)) + !(range 998) + ('abcdefghijklmnop' < ''))"
    error: eval
  # get 8, inputs.a 16 and 'b' 8, and reading its key, which is text, 1, and
  # length 8 of a number: 41. range 8, 2 and 5 16, and 3 numbers built, 48,
  # and length 8: 80. With +, 129. K is 460, M 1,001, with 6 letters.
  - expr: "map(((1000 range 10000) join '') split ',', b => (length(inputs.a get 'b') + length(2 range 5)) + length(filter(range 460, i => b < b)) + !(range 1001) + ('abcdef' < ''))"
    value: [3]
  - expr: "map(((1000 range 10000) join '') split ',', b => (length(inputs.a get 'b') + length(2 range 5)) + length(filter(range 460, i => b < b)) + !(range 1001) + ('abcdefg' < ''))"
    error: eval
  # A ternary counts 8, its condition, and the branch it takes, and nothing
  # for the other: 24 each, and + 8. K is 460, M 1,005, with 15 letters.
  - expr: "map(((1000 range 10000) join '') split ',', b => ((true ? 1 : b < b) + (false ? b < b : 2)) + length(filter(range 460, i => b < b)) + !(range 1005) + ('abcdefghijklmno' < ''))"
    value: [3]
  - expr: "map(((1000 range 10000) join '') split ',', b => ((true ? 1 : b < b) + (false ? b < b : 2)) + length(filter(range 460, i => b < b)) + !(range 1005) + ('abcdefghijklmnop' < ''))"
    error: eval
  # &&, || and ?? count 8, and nothing for an operand they don't need: 16
  # each, and two + 16. K is 460, M 1,005, with 7 letters.
  - expr: "map(((1000 range 10000) join '') split ',', b => ((0 && b < b) + (1 || b < b) + (1 ?? b < b)) + length(filter(range 460, i => b < b)) + !(range 1005) + ('abcdefg' < ''))"
    value: [2]
  - expr: "map(((1000 range 10000) join '') split ',', b => ((0 && b < b) + (1 || b < b) + (1 ?? b < b)) + length(filter(range 460, i => b < b)) + !(range 1005) + ('abcdefgh' < ''))"
