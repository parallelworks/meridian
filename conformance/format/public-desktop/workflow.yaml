# yaml-language-server: $schema=https://activate.parallel.works/workflow.schema.json
---
# Desktop - Interactive remote desktop session workflow
# Supports TigerVNC, TurboVNC, KasmVNC, and Singularity containers

permissions:
  - "*"

sessions:
  session:
    useTLS: false
    redirect: true # VNC uses redirect with custom slug for autoconnect

jobs:
  # =============================================================================
  # PREPROCESSING
  # =============================================================================
  preprocessing:
    steps:
      - name: Checkout service scripts
        uses: parallelworks/checkout
        ssh:
          remoteHost: ${{ inputs.resource.ip }}
        with:
          repo: https://github.com/parallelworks/activate-sessions.git
          branch: main
          sparse_checkout:
            - workflows/${{ inputs.workflow_dir }}
            - utils

      - name: Transfer inputs from user workspace
        run: |
          set -e
          REMOTE_JOB_DIR="./pw/jobs/${PW_WORKFLOW_NAME}/${PW_JOB_NUMBER}/"
          if [ -f inputs.sh ]; then
            echo "export PW_PLATFORM_HOST=$PW_PLATFORM_HOST" >> inputs.sh
            scp inputs.sh ${{ inputs.resource.ip }}:${REMOTE_JOB_DIR}
          fi

      - name: Run controller setup
        ssh:
          remoteHost: ${{ inputs.resource.ip }}
        run: |
          set -e
          cd workflows/${{ inputs.workflow_dir }}
          export KASM_BUCKET_URI="${{ inputs.desktop.kasmvnc_bucket.uri }}/${{ inputs.desktop.kasmvnc_bucket_path }}"
          export KASM_CONTAINER_RUNTIME="${{ inputs.desktop.kasmvnc_container_runtime }}"
          export KASM_ENROOT_DIR="${{ inputs.desktop.kasmvnc_enroot_container_dir }}"
          export CONTAINER_MOUNT_PATHS="${{ inputs.desktop.container_mount_paths }}"
          export KASMPROXY_RUNTIME="${{ inputs.desktop.kasmproxy_runtime }}"
          export KASMPROXY_ENROOT_PATH="${{ inputs.desktop.kasmproxy_enroot_path }}"
          export KASMPROXY_SINGULARITY_SOURCE="${{ inputs.desktop.kasmproxy_singularity_source }}"
          export KASMPROXY_SINGULARITY_PATH="${{ inputs.desktop.kasmproxy_singularity_path }}"
          export KASMPROXY_GIT_REPO="${{ inputs.desktop.kasmproxy_git_repo }}"
          export KASMPROXY_GIT_PATH="${{ inputs.desktop.kasmproxy_git_path }}"
          export PW_SESSION_NAME="${{ sessions.session }}"
          bash setup.sh

  # =============================================================================
  # SESSION RUNNER - runs start.sh on compute node
  # =============================================================================
  session_runner:
    needs: [preprocessing]
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: Run desktop session
        early-cancel: any-job-failed
        run: |
          set -e
          export PATH="$PATH:$HOME/pw"

          # Clean up stale marker files from previous runs
          rm -f CANCEL_STREAMING job.ended job.started HOSTNAME COMPLETED run.sh

          # Create run script from start.sh with job markers
          cat > run.sh << 'SHEBANG_EOF'
          #!/bin/bash
          SHEBANG_EOF

          echo "cd ${PWD}" >> run.sh

          # Add job markers
          cat >> run.sh << 'MARKER_EOF'
          export PATH="$PATH:$HOME/pw"
          touch job.started
          hostname > HOSTNAME
          echo "$(date) Job started on $(hostname)"
          MARKER_EOF

          # Append the actual start.sh
          cat workflows/${{ inputs.workflow_dir }}/start.sh >> run.sh
          chmod +x run.sh

          echo "$(date) Running desktop session script"

          # Execute script
          ./run.sh > run.${PW_JOB_ID}.out 2>&1
          exit_code=$?

          echo "$(date) Script completed with exit code: ${exit_code}"
          touch job.ended

          if [[ $exit_code -ne 0 ]]; then
            echo "$(date) ERROR: Script failed with exit code ${exit_code}"
            exit ${exit_code}
          fi

      - name: Notify job ended
        early-cancel: any-job-failed
        run: touch job.ended

  # ==============================================================================
  # WAIT FOR SERVICE - wait for job to start and get connection info
  # ==============================================================================
  wait_for_service:
    needs: [preprocessing]
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: Wait for desktop ready
        early-cancel: any-job-failed
        run: bash utils/wait_service.sh

  # =============================================================================
  # UPDATE SESSION - configure session proxy with custom slug
  # =============================================================================
  update_session:
    needs: [preprocessing, wait_for_service]
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: Get local port
        run: |
          local_port=$(pw agent open-port)
          echo "local_port=${local_port}" | tee -a $OUTPUTS

      - name: Update session with custom slug
        uses: parallelworks/update-session
        with:
          target: ${{ inputs.resource.id }}
          name: ${{ sessions.session }}
          slug: ${{ needs.preprocessing.outputs.slug }}
          remoteHost: ${{ needs.wait_for_service.outputs.HOSTNAME }}
          remotePort: ${{ needs.wait_for_service.outputs.SESSION_PORT }}
          local_port: ${{ needs.update_session.outputs.local_port }}

  # =============================================================================
  # COMPLETE - print connection info
  # =============================================================================
  complete:
    needs: [update_session]
    steps:
      - name: Display connection info
        run: |
          basepath="/me/session/${PW_USER}/${{ sessions.session }}"
          echo "=========================================="
          echo "Desktop Session is ready!"
          echo "=========================================="
          echo "  Connect via: ${PW_PLATFORM_HOST}${basepath}/"
          echo "=========================================="

"on":
  execute:
    inputs:
      resource:
        type: compute-clusters
        label: Service host
        include-workspace: false
        autoselect: true

      workflow_dir:
        type: string
        default: desktop
        hidden: true

      submit_to_scheduler:
        type: boolean
        label: Submit to Job Scheduler
        tooltip: "When enabled, the desktop job is submitted to the cluster's job scheduler (SLURM or PBS) and runs on an allocated compute node. When disabled, the desktop runs directly on the cluster's login node via SSH."
        default: false
        hidden: ${{ inputs.resource.schedulerType != 'slurm' && inputs.resource.schedulerType != 'pbs' }}

      slurm:
        type: group
        label: SLURM Configuration
        hidden: ${{ inputs.submit_to_scheduler != true || inputs.resource.schedulerType != 'slurm' }}
        collapsed: false
        items:
          is_disabled:
            type: boolean
            default: ${{ inputs.submit_to_scheduler != true || inputs.resource.schedulerType != 'slurm' }}
            hidden: true

          account:
            label: Account
            type: slurm-accounts
            resource: ${{ inputs.resource }}
            tooltip: SLURM account for job submission (--account)
            optional: true
            ignore: ${{ inputs.submit_to_scheduler != true || inputs.resource.schedulerType != 'slurm' }}

          partition:
            type: slurm-partitions
            label: Partition
            optional: true
            resource: ${{ inputs.resource }}
            tooltip: Partition for job submission (--partition)
            ignore: ${{ inputs.submit_to_scheduler != true || inputs.resource.schedulerType != 'slurm' }}

          qos:
            label: Quality of Service (QoS)
            type: slurm-qos
            resource: ${{ inputs.resource }}
            tooltip: SLURM QoS setting (--qos)
            optional: true
            ignore: ${{ inputs.submit_to_scheduler != true || inputs.resource.schedulerType != 'slurm' }}

          cpus_per_task:
            type: number
            label: CPUs per Task
            min: 1
            max: 256
            default: 1
            tooltip: Number of CPUs for the job (--cpus-per-task)
            ignore: ${{ inputs.submit_to_scheduler != true || inputs.resource.schedulerType != 'slurm' }}

          time:
            label: Walltime
            type: string
            default: 04:00:00
            tooltip: Maximum job duration, e.g., 04:00:00 (--time)
            ignore: ${{ inputs.submit_to_scheduler != true || inputs.resource.schedulerType != 'slurm' }}

          gres:
            label: GPUs (gres)
            type: dropdown
            default: ""
            optional: true
            tooltip: GPU resource specification (--gres). Leave empty for CPU-only jobs.
            options:
              - value: ""
                label: "No GPU (CPU only)"
              - value: "gpu:1"
                label: "1 GPU (gpu:1)"
              - value: "gpu:2"
                label: "2 GPUs (gpu:2)"
              - value: "gpu:4"
                label: "4 GPUs (gpu:4)"
              - value: "gpu:8"
                label: "8 GPUs (gpu:8)"
            ignore: ${{ inputs.submit_to_scheduler != true || inputs.resource.schedulerType != 'slurm' }}

          scheduler_directives:
            type: editor
            label: Additional Directives
            optional: true
            tooltip: Additional SLURM directives (include #SBATCH prefix)
            ignore: ${{ inputs.submit_to_scheduler != true || inputs.resource.schedulerType != 'slurm' }}

      pbs:
        type: group
        label: PBS Configuration
        hidden: ${{ inputs.submit_to_scheduler != true || inputs.resource.schedulerType != 'pbs' }}
        collapsed: false
        items:
          is_disabled:
            type: boolean
            default: ${{ inputs.submit_to_scheduler != true || inputs.resource.schedulerType != 'pbs' }}
            hidden: true

          account:
            label: Account
            type: string
            optional: true
            tooltip: PBS account for job submission (-A)
            ignore: ${{ inputs.submit_to_scheduler != true || inputs.resource.schedulerType != 'pbs' }}

          queue:
            label: Queue
            type: string
            optional: true
            tooltip: PBS queue name (-q)
            ignore: ${{ inputs.submit_to_scheduler != true || inputs.resource.schedulerType != 'pbs' }}

          walltime:
            label: Walltime
            type: string
            default: 04:00:00
            tooltip: Maximum job duration, e.g., 04:00:00 (-l walltime=)
            ignore: ${{ inputs.submit_to_scheduler != true || inputs.resource.schedulerType != 'pbs' }}

          select:
            label: Resource Selection
            type: string
            default: "1:ncpus=8:ngpus=1"
            placeholder: "1:ncpus=8:ngpus=1"
            tooltip: PBS resource selection string, e.g., 1:ncpus=8:ngpus=1 (-l select=)
            ignore: ${{ inputs.submit_to_scheduler != true || inputs.resource.schedulerType != 'pbs' }}

          scheduler_directives:
            label: Additional Directives
            type: editor
            tooltip: Additional PBS directives (include #PBS prefix)
            optional: true
            ignore: ${{ inputs.submit_to_scheduler != true || inputs.resource.schedulerType != 'pbs' }}

      desktop:
        type: group
        label: Desktop Settings
        items:
          vnc_mode:
            type: dropdown
            label: VNC Server Mode
            default: native
            tooltip: Choose how the VNC server is provided
            options:
              - label: "Native (auto-detect installed VNC)"
                value: native
              - label: "Native VNC + KasmProxy"
                value: kasmproxy
              - label: "KasmVNC Container"
                value: kasmvnc_container

          environment:
            type: dropdown
            label: Desktop Environment
            default: auto
            hidden: ${{ inputs.desktop.vnc_mode == 'kasmvnc_container' }}
            options:
              - label: Auto-detect
                value: auto
              - label: GNOME
                value: gnome
              - label: XFCE
                value: xfce
              - label: MATE
                value: mate
              - label: Cinnamon
                value: cinnamon
              - label: KDE Plasma
                value: kde
              - label: LXDE
                value: lxde

          kasmvnc_container_runtime:
            type: dropdown
            label: Container Runtime
            default: singularity
            tooltip: Choose the container runtime to use
            hidden: ${{ inputs.desktop.vnc_mode != 'kasmvnc_container' }}
            options:
              - label: "Singularity"
                value: singularity
              - label: "Enroot"
                value: enroot

          kasmvnc_os:
            type: dropdown
            label: Operating System
            default: rocky9
            tooltip: Choose the operating system for the KasmVNC container
            hidden: ${{ inputs.desktop.vnc_mode != 'kasmvnc_container' }}
            options:
              - label: "Rocky Linux 8"
                value: rocky8
              - label: "Rocky Linux 9"
                value: rocky9
              - label: "Ubuntu 22.04"
                value: ubuntu

          kasmvnc_container_source:
            type: dropdown
            label: Container Source
            default: git_lfs
            hidden: ${{ inputs.desktop.vnc_mode != 'kasmvnc_container' || inputs.desktop.kasmvnc_container_runtime == 'enroot' }}
            options:
              - label: "Pull from Git LFS"
                value: git_lfs
              - label: "Pull from PW Bucket"
                value: bucket
              - label: "Path on remote system"
                value: path

          kasmvnc_container_path:
            type: string
            label: Container Path
            placeholder: "/path/to/kasmvnc.sif"
            tooltip: Full path to the Singularity container on the remote system
            hidden: ${{ inputs.desktop.vnc_mode != 'kasmvnc_container' || inputs.desktop.kasmvnc_container_runtime == 'enroot' || inputs.desktop.kasmvnc_container_source != 'path' }}

          kasmvnc_bucket:
            type: bucket
            label: Bucket
            tooltip: PW bucket containing the KasmVNC container
            hidden: ${{ inputs.desktop.vnc_mode != 'kasmvnc_container' || inputs.desktop.kasmvnc_container_runtime == 'enroot' || inputs.desktop.kasmvnc_container_source != 'bucket' }}

          kasmvnc_bucket_path:
            type: string
            label: Container Path in Bucket
            default: "kasmvnc-rocky9.sif"
            placeholder: "kasmvnc-rocky9.sif"
            tooltip: Path to the container file within the bucket (use kasmvnc-rocky9.sif or kasmvnc-ubuntu.sif)
            hidden: ${{ inputs.desktop.vnc_mode != 'kasmvnc_container' || inputs.desktop.kasmvnc_container_runtime == 'enroot' || inputs.desktop.kasmvnc_container_source != 'bucket' }}

          kasmvnc_git_repo:
            type: string
            label: Git Repository
            default: "https://github.com/parallelworks/singularity-containers.git"
            tooltip: Git repository URL containing the KasmVNC container
            hidden: ${{ inputs.desktop.vnc_mode != 'kasmvnc_container' || inputs.desktop.kasmvnc_container_runtime == 'enroot' || inputs.desktop.kasmvnc_container_source != 'git_lfs' }}

          kasmvnc_git_path:
            type: string
            default: "kasmvnc-rocky9"
            hidden: true

          kasmvnc_enroot_container_dir:
            type: string
            label: Enroot Container Directory
            default: "/mnt/data/containers"
            placeholder: "/mnt/data/containers"
            tooltip: Directory containing the Enroot container (.sqsh file). The container name is derived from the OS selection.
            hidden: ${{ inputs.desktop.vnc_mode != 'kasmvnc_container' || inputs.desktop.kasmvnc_container_runtime != 'enroot' }}

          container_mount_paths:
            type: string
            textarea: true
            label: Container Mount Paths
            placeholder: "/mnt/data\n/shared/datasets"
            tooltip: Directories to mount into the container (one per line)
            optional: true
            hidden: ${{ inputs.desktop.vnc_mode != 'kasmvnc_container' }}

          kasmvnc_enable_gpu:
            type: boolean
            label: Enable GPU Support (--nv)
            default: false
            tooltip: Pass --nv flag to Singularity for NVIDIA GPU support. Warning - requires matching GLIBC versions between host and container.
            hidden: true

          kasmproxy_runtime:
            type: dropdown
            label: KasmProxy Container Runtime
            default: enroot
            tooltip: Choose the container runtime for the proxy
            hidden: ${{ inputs.desktop.vnc_mode != 'kasmproxy' }}
            options:
              - label: "Enroot"
                value: enroot
              - label: "Singularity"
                value: singularity

          kasmproxy_enroot_path:
            type: string
            label: KasmProxy Enroot Container
            default: "/mnt/data/containers/kasmproxy.sqsh"
            placeholder: "/mnt/data/containers/kasmproxy.sqsh"
            tooltip: Path to the KasmProxy Enroot container (.sqsh file)
            hidden: ${{ inputs.desktop.vnc_mode != 'kasmproxy' || inputs.desktop.kasmproxy_runtime != 'enroot' }}

          kasmproxy_singularity_source:
            type: dropdown
            label: Singularity Container Source
            default: git_lfs
            tooltip: Choose where to get the KasmProxy Singularity container
            hidden: ${{ inputs.desktop.vnc_mode != 'kasmproxy' || inputs.desktop.kasmproxy_runtime != 'singularity' }}
            options:
              - label: "Pull from Git LFS"
                value: git_lfs
              - label: "Path on remote system"
                value: path

          kasmproxy_singularity_path:
            type: string
            label: KasmProxy Singularity Container Path
            default: "~/pw/singularity/kasmproxy.sif"
            placeholder: "~/pw/singularity/kasmproxy.sif"
            tooltip: Path to the KasmProxy Singularity container (.sif file)
            hidden: ${{ inputs.desktop.vnc_mode != 'kasmproxy' || inputs.desktop.kasmproxy_runtime != 'singularity' || inputs.desktop.kasmproxy_singularity_source != 'path' }}

          kasmproxy_git_repo:
            type: string
            label: Git Repository
            default: "https://github.com/parallelworks/singularity-containers.git"
            tooltip: Git repository URL containing the KasmProxy container
            hidden: ${{ inputs.desktop.vnc_mode != 'kasmproxy' || inputs.desktop.kasmproxy_runtime != 'singularity' || inputs.desktop.kasmproxy_singularity_source != 'git_lfs' }}

          kasmproxy_git_path:
            type: string
            label: Container Path in Repo
            default: "kasmproxy"
            tooltip: Directory in the repository containing the container
            hidden: ${{ inputs.desktop.vnc_mode != 'kasmproxy' || inputs.desktop.kasmproxy_runtime != 'singularity' || inputs.desktop.kasmproxy_singularity_source != 'git_lfs' }}


