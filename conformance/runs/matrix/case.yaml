description: >-
  A matrix job runs each of its instances, which read their matrix values,
  and succeeds once they all have.
source: Meridian
expect:
  run:
    outcome: success
    jobs:
      build:
        outcome: success
      build#0:
        outcome: success
        logs:
          - {step: 0, text: "n=1\n"}
      build#1:
        outcome: success
        logs:
          - {step: 0, text: "n=2\n"}
