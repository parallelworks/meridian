description: >-
  A default that reads something the compiler doesn't have, such as env or a
  secret variable, stays an expression until the run is underway. So does
  one that reads a variable that isn't a secret: the compiler has its value,
  but a plan never holds a variable's value.
source: Meridian
contexts:
  vars:
    REGION: us-east
    TOKEN: unused
secret-variables: [TOKEN]
expect:
  deferred: [dir, token, region]