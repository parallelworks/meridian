description: >-
  A default that reads a part of an input whose value reads an organization
  or user variable stays an expression until the run is underway, however
  its path reaches that part: a slice of a list reads its rows, as 0:1 reads
  the first and -1: the last, and a row's index can be written 00, +0 or -0
  as well as 0. One that reads only the parts that don't read a variable,
  as names reads the rows' names, has its value.
source: Meridian
contexts:
  org:
    REGION: us-east
expect:
  inputs:
    names: a
  deferred: [hosts, last, signed, slice, zero]