description: >-
  A launch form evaluates a default that reads an organization or user
  variable, and sends what it gives. A submitted value that is what the
  default gives means the default, as its text does, so the plan holds the
  expression, not the variable's value: a number given as the text it
  gives, or as a number, is it too, and so is what a default gives that
  reads the variable through another input's default. Any other value
  there, such as what the person typed in its place, or what a default
  that reads its own input gave once, can hold the variable's value, so
  the plan doesn't hold it either. It is private, as the variable's value
  is, and kept as a secret where the variable is one.
source: Meridian
contexts:
  vars:
    REGION: us-east
    REPLICAS: "3"
    KEY: unused
  org:
    OWNER: research
secret-variables: [KEY]
inputs:
  region: us-east
  zone: us-east-a
  replicas: 3
  owner: someone-else
  mirror: us-east
  label: us-east
  key: typed-key
expect:
  deferred:
    region: ${{ vars.REGION }}
    zone: ${{ vars.REGION }}-a
    replicas: ${{ vars.REPLICAS }}
    mirror: ${{ ..region.default }}
  private:
    owner: someone-else
    label: us-east
  secrets:
    key: typed-key
