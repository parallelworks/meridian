description: >-
  What the run evaluates as it starts reads the inputs as they were given,
  as what was evaluated when the run was created read them, before they
  were converted to their types: a default, a condition decided again and
  the workflow's env: read the text 2.50 a form sent for a number. The run's
  values hold the number.
source: Meridian
contexts:
  org:
    PREFIX: p
inputs:
  cpus: "2.50"
expect:
  inputs:
    cpus: 2.5
    label: p-2.50
  env:
    CPUS: "2.50"
  run-private: [inputs.label]
