on:
  execute:
    inputs:
      clean:
        type: boolean
        default: false
jobs:
  simulate:
    retry:
      reasons: [worker-lost]
      max-retries: 3
      interval: 30s
    steps:
      - run: ./simulate
        retry:
          max-retries: 2
          interval: 10s
          timeout: 1m
          clean-on-retry: true
      - run: ./simulate
        retry:
          max-retries: 2
          clean-on-retry: false
      - run: ./simulate
        retry:
          max-retries: 2
      - run: ./simulate
        retry:
          max-retries: 2
          clean-on-retry: ${{ inputs.clean }}
