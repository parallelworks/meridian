description: >-
  needs.<job> has a needed job's outputs, its result and its steps, which
  format 1 reads as needs.<job>.result, needs.<job>.outputs.<name> and
  needs.<job>.steps.<id>.outputs.<name>; needs.<job>.steps.<id> names one of
  that job's steps, and needs.<job> a job the workflow has, or it is an
  error. Any other reference to needs, such as another key, needs.<job> or
  needs.<job>.outputs, whatever job it names, reads as its own text, as
  format 1 reads a word it doesn't know, and is a warning.
source: Meridian, and ACTIVATE's parser
