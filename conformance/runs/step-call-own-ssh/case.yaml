description: >-
  A step that calls a workflow with an ssh: of its own that names a host
  fails, without calling it: format 1 connects to the host, gives the
  workflow it calls the host's paths, and runs it where its caller runs,
  which Meridian doesn't, as design.md lists.
source: Meridian
repositories: [github/conformance/step-call-own-ssh]
hosts:
  farm: {}
expect:
  run:
    outcome: failure
    jobs:
      main:
        outcome: failure
        logs:
          - {step: 1, text: "the call was refused\n"}
