name: CI

on:
  pull_request:
  push:
    branches: [canary]

permissions:
  contents: read

# A newer push to a PR supersedes the run before it. Runs on canary are never
# canceled, so that every merged commit keeps its own result: each commit has
# a group of its own, since a group holds one pending run and cancels it when
# another arrives, whatever cancel-in-progress says.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/canary' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/canary' }}

# Naming the shell adds pipefail, which the default shell leaves off.
defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: Verify go.mod is tidy
        run: make tidy-check
      - name: Lint
        run: make lint
      - name: Check for known vulnerabilities
        run: make vulncheck
      - name: Check that nothing uses cgo
        run: make cgo-check

  # CI runs only Linux, so the code for macOS, the BSDs and Windows is
  # compiled and vetted, tests included, without running. It's a job of its
  # own, beside lint, because each of its eight platforms compiles all of the
  # code again: on a busy runner that alone has taken eleven minutes.
  vet-cross:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: Vet the code for macOS, the BSDs and Windows
        run: make vet-cross

  # Audits the workflows themselves: unpinned actions, script injection,
  # over-broad tokens, leaked credentials. Any finding fails the job.
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          # Fail the job on a finding rather than upload it to code scanning.
          advanced-security: false

  test:
    runs-on: ubuntu-latest
    # go test's own 10-minute timeout fires first and prints the goroutines.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: Test
        env:
          # go.mod and the Makefile also set fips140=only; the environment makes
          # the mode explicit so that a future edit cannot silently drop it.
          GODEBUG: fips140=only
        run: make test
      # An int is 32 bits on 32-bit platforms, which x86-64 Linux runs
      # natively. With CI set, as Actions sets it, the target fails rather
      # than skip the tests if the runner can't run them.
      - name: Test on 32-bit x86
        env:
          GODEBUG: fips140=only
        run: make test-386
      # Once each, to catch a benchmark that no longer runs, not to measure.
      - name: Run each benchmark once
        env:
          GODEBUG: fips140=only
        run: make bench
      - name: Build
        run: make build
      - name: Build what editors run as WebAssembly
        run: make wasm

  # The ssh backend's tests against OpenSSH's sshd, as well as against the
  # SSH server the tests run in process, which can't be all of OpenSSH. Each
  # test starts the runner's sshd as the runner's user, on a port of the
  # loopback interface, with a host key, a config and the keys it accepts
  # made for that test alone (internal/opensshtest): the tests reach nothing
  # beyond the runner, and need no secret.
  openssh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      # The tests start sshd themselves; the system's own, which the
      # package starts on port 22, isn't used, and is stopped.
      - name: Install OpenSSH's server
        run: |
          if [ ! -x /usr/sbin/sshd ]; then
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends openssh-server
          fi
          sudo systemctl disable --now ssh.socket ssh.service 2>/dev/null || true
          ssh -V
      - name: Test against OpenSSH's sshd
        env:
          GODEBUG: fips140=only
          SSHD: /usr/sbin/sshd
        run: make test-openssh

  # The one place cgo is enabled: on Linux, the race detector links
  # ThreadSanitizer, a C++ runtime, against the C library. Nothing built here
  # ships.
  race:
    runs-on: ubuntu-latest
    # go test's own 15-minute timeout, set in the Makefile, fires first and
    # prints the goroutines.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: Test with the race detector
        env:
          GODEBUG: fips140=only
        run: make test-race
