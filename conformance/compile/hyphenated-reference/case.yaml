description: >-
  A hyphen is a minus sign, so inputs.pw-user subtracts the text "user" from
  inputs.pw, which is NaN. That probably meant the input pw-user, which is
  read as inputs['pw-user'], so it is a warning at the reference, as well as
  the warning that there is no input pw.
source: Meridian
expect:
  diagnostics:
    - severity: warning
      code: hyphenated_name
      path: /jobs/build/steps/0/run
      line: 10
      column: 23
      params:
        written: inputs.pw
        word: user
        name: pw-user
        fix: inputs['pw-user']
        defines: input
        defined: pw-user
    - severity: warning
      code: undefined_input
      path: /jobs/build/steps/0/run
      line: 10
      column: 23
      params: {name: pw}
  plan:
    /warnings/0/code: hyphenated_name
    /warnings/1/code: undefined_input
